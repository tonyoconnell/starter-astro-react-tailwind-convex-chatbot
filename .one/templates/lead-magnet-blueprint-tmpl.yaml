# Advanced template features and validation
variables:
  value_promise:
    type: string
    min_length: 20
    max_length: 100
    validation:
      - specific_outcome_focused: "Value promise must focus on specific, achievable outcomes"
      - customer_language: "Must use customer language, not industry jargon"
      - unique_differentiation: "Must highlight unique approach or insight"

  delivery_method:
    type: string
    enum: ["digital_download", "email_course", "video_series", "webinar", "physical_kit", "interactive_tool", "assessment", "template_package"]
    validation:
      - audience_alignment: "Delivery method must match target audience preferences"
      - value_optimization: "Method must optimize value delivery and consumption"
      - conversion_optimization: "Must facilitate natural progression to core offer"

  follow_up_sequence:
    type: object
    properties:
      sequence_length:
        type: number
        min: 3
        max: 10
      email_subjects:
        type: array
        min_items: 3
      progression_strategy:
        type: string
        min_length: 50
    validation:
      - value_building: "Each touchpoint must build additional value"
      - natural_progression: "Sequence must create natural progression to core offer"
      - engagement_optimization: "Must maintain and increase engagement over time"

  success_metrics:
    type: object
    properties:
      lead_volume_target:
        type: number
        min: 1
      lead_quality_criteria:
        type: array
        min_items: 3
      conversion_rate_target:
        type: number
        min: 0.01
        max: 1.0
      roi_projection:
        type: object
        required: ["cost_per_lead", "lifetime_value", "payback_period"]
    validation:
      - realistic_targets: "Targets must be realistic based on industry benchmarks"
      - measurable_criteria: "All criteria must be clearly measurable"
      - business_alignment: "Metrics must align with business objectives"

quality_checks:
  strategic_alignment:
    - foundation_integration: "Must integrate company foundation elements throughout"
    - unique_mechanism_leverage: "Must clearly leverage and preview unique mechanism"
    - brand_voice_consistency: "Must maintain brand voice consistency"
    - value_proposition_alignment: "Must align with and support core value propositions"

  customer_value:
    - problem_solution_fit: "Must address real, significant customer problems"
    - value_delivery_optimization: "Must optimize value delivery for target audience"
    - outcome_achievement: "Must enable customers to achieve meaningful outcomes"
    - engagement_facilitation: "Must facilitate natural engagement and progression"

  conversion_optimization:
    - clear_value_promise: "Value promise must be clear and compelling"
    - friction_minimization: "Must minimize friction in access and consumption"
    - natural_progression: "Must create natural progression to core offer"
    - multiple_conversion_points: "Must include multiple engagement and conversion opportunities"

  implementation_feasibility:
    - resource_realism: "Resource requirements must be realistic and achievable"
    - timeline_feasibility: "Implementation timeline must be feasible"
    - skill_alignment: "Must align with team skills and capabilities"
    - roi_viability: "Must demonstrate clear path to positive ROI"

conditional_logic:
  delivery_method:
    digital_download:
      format_requirements: ["pdf_optimization", "mobile_friendly", "printable_option"]
      engagement_strategy: ["email_sequence", "bonus_content", "community_access"]
    email_course:
      format_requirements: ["sequential_delivery", "action_items", "progress_tracking"]
      engagement_strategy: ["daily_emails", "worksheet_integration", "milestone_rewards"]
    video_series:
      format_requirements: ["video_quality", "accessibility", "download_options"]
      engagement_strategy: ["community_discussion", "implementation_support", "live_sessions"]
    physical_kit:
      format_requirements: ["quality_materials", "packaging_experience", "durability"]
      engagement_strategy: ["unboxing_experience", "digital_companion", "community_sharing"]
    interactive_tool:
      format_requirements: ["user_experience", "mobile_responsive", "data_privacy"]
      engagement_strategy: ["results_sharing", "improvement_tracking", "expert_interpretation"]

  target_audience:
    b2b_executives:
      content_preferences: ["executive_summary", "strategic_insights", "roi_focus"]
      delivery_optimization: ["mobile_friendly", "time_efficient", "actionable_insights"]
    b2b_practitioners:
      content_preferences: ["detailed_instructions", "templates", "case_studies"]
      delivery_optimization: ["comprehensive_guides", "implementation_support", "peer_community"]
    b2c_consumers:
      content_preferences: ["visual_appeal", "entertainment_value", "personal_relevance"]
      delivery_optimization: ["social_sharing", "emotional_connection", "lifestyle_integration"]

input_validation:
  required_fields:
    - company_name
    - unique_mechanism_name
    - primary_value_proposition
    - target_avatar_segment
    - core_problem_statement
    - primary_value_promise
    - primary_magnet_type
    - delivery_method_strategy
    - follow_up_sequence_duration
    - lead_volume_target

  conditional_requirements:
    delivery_method:
      digital_download: ["file_formats", "download_experience", "mobile_optimization"]
      email_course: ["sequence_length", "email_frequency", "content_progression"]
      video_series: ["video_length", "production_quality", "hosting_platform"]
      physical_kit: ["shipping_method", "packaging_design", "production_standards"]
      interactive_tool: ["technology_platform", "user_experience", "data_handling"]

  quality_criteria:
    value_promise:
      - outcome_specific: "Must specify clear, achievable outcomes"
      - time_bound: "Should include timeframe for value realization"
      - unique_angle: "Must include unique approach or insight"
      - customer_focused: "Must focus on customer benefits, not company features"

    content_strategy:
      - value_dense: "Content must be genuinely valuable and actionable"
      - mechanism_preview: "Must preview unique mechanism without giving everything away"
      - natural_progression: "Must create natural desire for deeper engagement"
      - brand_reinforcement: "Must reinforce brand voice and positioning"

    conversion_strategy:
      - friction_free: "Must minimize barriers to access and consumption"
      - value_first: "Must lead with value before asking for commitment"
      - multiple_touchpoints: "Must include multiple engagement opportunities"
      - clear_next_steps: "Must provide clear path to deeper engagement"