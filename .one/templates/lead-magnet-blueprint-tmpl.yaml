template:
  id: lead-magnet-blueprint-template-v1
  name: Lead Magnet Blueprint
  version: 1.0
  output:
    format: markdown
    filename: "docs/{{company_name}}-lead-magnet-blueprint.md"
    title: "{{company_name}} Lead Magnet Blueprint"

workflow:
  mode: interactive
  elicitation: rocket-framework
  custom_elicitation:
    title: "R.O.C.K.E.T. Framework Lead Magnet Development"
    sections:
      - id: research-value-discovery
        options:
          - "Customer Pain Point Analysis - Deep dive into specific customer frustrations"
          - "Value Delivery Investigation - Explore what customers truly value most"
          - "Content Consumption Preferences - Understand how customers prefer to learn"
          - "Competitive Lead Magnet Analysis - Review competitor offerings and gaps"
          - "Customer Language Mining - Extract exact phrases customers use about problems"
          - "Decision Trigger Research - Identify what prompts customers to seek solutions"
          - "Proceed to opportunity validation"
      - id: opportunity-validation
        options:
          - "Value Promise Testing - Validate lead magnet value proposition resonance"
          - "Format Optimization Testing - Test different content formats and delivery methods"
          - "Timing and Context Validation - Ensure optimal placement in customer journey"
          - "Competitive Advantage Assessment - Strengthen unique positioning of offer"
          - "Lead Quality Prediction - Assess likely quality of leads generated"
          - "Conversion Potential Analysis - Evaluate lead-to-customer conversion likelihood"
          - "Proceed to clarity optimization"
      - id: clarity-optimization
        options:
          - "Value Promise Simplification - Clarify and simplify the core promise"
          - "Content Structure Optimization - Organize for maximum comprehension and impact"
          - "Call-to-Action Refinement - Optimize conversion elements and messaging"
          - "Delivery Method Streamlining - Simplify access and consumption process"
          - "Follow-up Sequence Clarification - Ensure seamless nurture experience"
          - "Success Metrics Definition - Clarify measurement and optimization framework"
          - "Proceed to execution planning"

sections:
  - id: initial-setup
    instruction: |
      Lead Magnet Blueprint Creation Guide (Elevate Framework GIFT Step)
      
      This template creates a comprehensive lead magnet strategy based on the Elevate Framework GIFT methodology,
      designed to build trust through value delivery and facilitate natural progression to the IDENTIFY step.
      
      The blueprint leverages:
      - Psychology of reciprocity and trust-building through genuine value delivery
      - Value Equation principles (Dream Outcome * Perceived Likelihood / Time Delay * Effort & Sacrifice)
      - Foundation Blueprint intelligence for Avatar-specific problem solving
      - Strategic value demonstration before commitment (Intent-Based Branding)
      - Mini-Dream Outcome delivery for immediate satisfaction and trust building
      - Natural bridge to core offer through mechanism preview
      
      Key Principle: The GIFT is far more than a lead magnet—it's a strategic demonstration of competence,
      a trust-building mechanism, and a mini-transformation that creates desire for deeper engagement.
      
      The blueprint serves as the strategic foundation for lead generation activities and ensures alignment with overall marketing objectives.
      
      Output file location: `docs/{{company_name}}-lead-magnet-blueprint.md`

  - id: strategic-context-discovery
    title: Strategic Context & Foundation Alignment
    instruction: |
      Establish connection between lead magnet strategy and company foundation.
      Ensure all lead generation efforts reinforce unique mechanism and brand voice.
      Use advanced elicitation to understand strategic positioning requirements.
    elicit: true
    custom_elicitation: research-value-discovery
    sections:
      - id: foundation-alignment
        title: Company Foundation Integration
        template: |
          **Brand Voice Integration:**
          - Primary Voice Adjectives: {{primary_voice_adjectives}}
          - Voice Application in Lead Magnet: {{voice_application_strategy}}
          - Tone Consistency Requirements: {{tone_consistency_guidelines}}

          **Unique Mechanism Leverage:**
          - Core Mechanism: {{unique_mechanism_name}}
          - Mechanism Preview in Lead Magnet: {{mechanism_preview_strategy}}
          - Differentiation Showcase: {{differentiation_demonstration}}

          **Value Proposition Alignment:**
          - Primary Value Proposition: {{primary_value_proposition}}
          - Lead Magnet Value Connection: {{value_connection_strategy}}
          - Promise-to-Product Bridge: {{promise_product_bridge}}

      - id: customer-avatar-alignment
        title: Customer Avatar & Journey Integration
        template: |
          **Primary Avatar Focus:**
          - Target Avatar: {{primary_avatar_segment}}
          - Avatar Pain Points: {{avatar_pain_points}}
          - Avatar Goals & Aspirations: {{avatar_goals}}
          - Avatar Content Preferences: {{avatar_content_preferences}}

          **Customer Journey Positioning:**
          - Journey Stage: {{target_journey_stage}}
          - Entry Point Strategy: {{journey_entry_strategy}}
          - Next Step Facilitation: {{next_step_facilitation}}
          - Long-term Relationship Building: {{relationship_building_approach}}

  - id: rocket-research-problem-discovery
    title: Problem Discovery & Value Research (R.O.C.K.E.T. Research)
    instruction: |
      Apply R.O.C.K.E.T. Research methodology to identify high-value customer problems.
      Use advanced elicitation to explore pain points, frustrations, and unmet needs.
      Focus on problems that your unique mechanism can address effectively.
    elicit: true
    custom_elicitation: research-value-discovery
    sections:
      - id: primary-problem-identification
        title: Primary Problem Identification
        template: |
          **Core Problem Statement:**
          {{core_problem_statement}}

          **Problem Manifestations:**
          1. **Symptom:** {{problem_symptom_1}}
             - **Impact:** {{symptom_1_impact}}
             - **Frequency:** {{symptom_1_frequency}}
             - **Cost/Consequence:** {{symptom_1_cost}}

          2. **Symptom:** {{problem_symptom_2}}
             - **Impact:** {{symptom_2_impact}}
             - **Frequency:** {{symptom_2_frequency}}
             - **Cost/Consequence:** {{symptom_2_cost}}

          3. **Symptom:** {{problem_symptom_3}}
             - **Impact:** {{symptom_3_impact}}
             - **Frequency:** {{symptom_3_frequency}}
             - **Cost/Consequence:** {{symptom_3_cost}}

          **Customer Language & Phrases:**
          - "{{customer_phrase_1}}"
          - "{{customer_phrase_2}}"
          - "{{customer_phrase_3}}"
          - "{{customer_phrase_4}}"

      - id: problem-urgency-analysis
        title: Problem Urgency & Priority Analysis
        template: |
          **Urgency Assessment:**
          - **Immediate Impact:** {{immediate_impact_description}}
          - **Time Sensitivity:** {{time_sensitivity_level}}
          - **Cost of Inaction:** {{inaction_cost_analysis}}

          **Priority Level Indicators:**
          - **High Priority Signals:** {{high_priority_signals}}
          - **Medium Priority Signals:** {{medium_priority_signals}}
          - **Decision Triggers:** {{decision_trigger_events}}

          **Competitive Context:**
          - **Market Awareness:** {{market_awareness_level}}
          - **Solution Alternatives:** {{alternative_solutions}}
          - **Our Advantage:** {{our_solution_advantage}}

      - id: value-opportunity-mapping
        title: Value Delivery Opportunity Mapping
        template: |
          **Primary Value Opportunities:**
          1. **Opportunity:** {{value_opportunity_1}}
             - **Customer Benefit:** {{opportunity_1_benefit}}
             - **Unique Delivery:** {{opportunity_1_unique_delivery}}
             - **Proof Potential:** {{opportunity_1_proof}}

          2. **Opportunity:** {{value_opportunity_2}}
             - **Customer Benefit:** {{opportunity_2_benefit}}
             - **Unique Delivery:** {{opportunity_2_unique_delivery}}
             - **Proof Potential:** {{opportunity_2_proof}}

          3. **Opportunity:** {{value_opportunity_3}}
             - **Customer Benefit:** {{opportunity_3_benefit}}
             - **Unique Delivery:** {{opportunity_3_unique_delivery}}
             - **Proof Potential:** {{opportunity_3_proof}}

          **Value Delivery Framework:**
          {{value_delivery_framework}}

  - id: rocket-opportunity-magnet-strategy
    title: Lead Magnet Strategy Development (R.O.C.K.E.T. Opportunity)
    instruction: |
      Apply R.O.C.K.E.T. Opportunity methodology to develop lead magnet strategy.
      Use advanced elicitation to optimize format, delivery, and positioning.
      Ensure strategy leverages unique mechanism and maximizes conversion potential.
    elicit: true
    custom_elicitation: opportunity-validation
    sections:
      - id: magnet-type-selection
        title: GIFT Format Selection (Value Equation Optimized)
        template: |
          **Primary GIFT Format:** {{primary_magnet_type}}

          **Format Selection Strategy (Value Equation Alignment):**
          
          **Format Options Evaluation:**
          
          **Checklists/Worksheets:**
          - **Value Delivery:** Actionable auditing/implementation guidance
          - **Consumption Effort:** Low (quick scan/complete)
          - **Perceived Value:** High (immediate applicability)
          - **Avatar Fit:** {{checklist_avatar_fit_assessment}}
          
          **Templates/Frameworks:**
          - **Value Delivery:** Ready-to-use structures (emails, strategies, spreadsheets)
          - **Time Savings:** Massive (eliminates creation time)
          - **Implementation Ease:** High (copy-paste-customize)
          - **Avatar Fit:** {{template_avatar_fit_assessment}}
          
          **Short Guides/Reports (10-15 pages max):**
          - **Value Delivery:** Focused insights, data, or how-to instructions
          - **Consumption Time:** 10-15 minutes maximum
          - **Credibility Building:** High (demonstrates expertise)
          - **Avatar Fit:** {{guide_avatar_fit_assessment}}
          
          **Interactive Tools (Calculators/Quizzes):**
          - **Value Delivery:** Personalized feedback and insights
          - **Engagement Level:** Very high (interactive experience)
          - **Technical Requirements:** Higher (development needed)
          - **Avatar Fit:** {{interactive_avatar_fit_assessment}}
          
          **Video Tutorials (Short <10 min):**
          - **Value Delivery:** Visual learning and demonstration
          - **Trust Building:** High (face-to-face connection)
          - **Consumption Effort:** Low (passive watching)
          - **Avatar Fit:** {{video_avatar_fit_assessment}}
          
          **AI Chatbot Diagnostics:**
          - **Value Delivery:** Instant, personalized advice
          - **AI Capability Showcase:** Direct demonstration
          - **Engagement:** Very high (conversation-based)
          - **Avatar Fit:** {{chatbot_avatar_fit_assessment}}

          **Selected Format Justification:**
          {{format_selection_rationale}}
          
          **Value Equation Optimization:**
          - **Dream Outcome Delivery:** {{do_delivery_method}}
          - **Perceived Likelihood Enhancement:** {{pl_enhancement_strategy}}
          - **Time Delay Minimization:** {{td_minimization_approach}}
          - **Effort Sacrifice Reduction:** {{es_reduction_strategy}}

          **Alternative Formats Considered:**
          1. {{alternative_format_1}} - Rejected because: {{rejection_reason_1}}
          2. {{alternative_format_2}} - Rejected because: {{rejection_reason_2}}
          3. {{alternative_format_3}} - Rejected because: {{rejection_reason_3}}

          **Delivery Method Strategy:**
          {{delivery_method_strategy}}
          
          **Format-Avatar Alignment:**
          - **Problem-Solution Fit:** {{problem_solution_format_fit}}
          - **Consumption Preferences:** {{consumption_preference_alignment}}
          - **Implementation Style:** {{implementation_style_match}}
          - **Value Perception:** {{value_perception_optimization}}

      - id: value-promise-framework
        title: Lead Magnet Value Promise Framework (Value Equation Optimized)
        template: |
          **Primary Value Promise (Mini-Dream Outcome):**
          {{primary_value_promise}}

          **Value Equation Optimization (Hormozi Framework):**
          
          **Maximize Mini-Dream Outcome (DO):**
          - **Specific Sub-Problem Solved:** {{specific_sub_problem}}
          - **Tangible Quick Win:** {{tangible_quick_win}}
          - **Aha Moment Delivered:** {{aha_moment_description}}
          - **Progress Feeling Created:** {{progress_feeling}}
          - **Connection to Core Desire:** {{core_desire_connection}}
          
          **Maximize Perceived Likelihood (PL):**
          - **Professional Presentation:** {{professional_presentation_strategy}}
          - **Clear Promise Articulation:** {{clear_promise_strategy}}
          - **Credibility Association:** {{credibility_association_method}}
          - **Authority Building:** {{authority_building_elements}}
          - **Social Proof Integration:** {{social_proof_integration}}
          
          **Minimize Time Delay (TD):**
          - **Instant Gratification:** {{instant_gratification_delivery}}
          - **Immediate Access Method:** {{immediate_access_strategy}}
          - **Quick Value Realization:** {{quick_value_timeline}}
          - **Seamless Delivery:** {{seamless_delivery_approach}}
          
          **Minimize Effort & Sacrifice (ES):**
          - **Consumption Effort:** {{consumption_effort_minimization}}
          - **Acquisition Effort:** {{acquisition_effort_reduction}}
          - **Implementation Barrier Removal:** {{implementation_barrier_strategy}}
          - **Cognitive Load Reduction:** {{cognitive_load_strategy}}

          **Promise Breakdown:**
          - **Functional Value:** {{functional_value_delivery}}
          - **Emotional Value:** {{emotional_value_delivery}}
          - **Time Value:** {{time_value_delivery}}
          - **Social Value:** {{social_value_delivery}}

          **Outcome Specification:**
          - **Immediate Outcome:** {{immediate_outcome}}
          - **Short-term Outcome:** {{short_term_outcome}}
          - **Long-term Connection:** {{long_term_connection}}

          **Trust & Reciprocity Elements:**
          - **Reciprocity Trigger:** {{reciprocity_trigger_strategy}}
          - **Trust Building Method:** {{trust_building_approach}}
          - **Risk Reduction:** {{risk_reduction_elements}}
          - **Value Anchoring:** {{value_anchoring_strategy}}

          **Proof Elements:**
          - **Competence Demonstration:** {{competence_demonstration}}
          - **Authority Proof:** {{authority_proof_elements}}
          - **Social Proof Element:** {{social_proof_element}}
          - **Results Preview:** {{results_preview_strategy}}

      - id: positioning-differentiation
        title: Competitive Positioning & Differentiation
        template: |
          **Unique Positioning Statement:**
          {{unique_positioning_statement}}

          **Differentiation Elements:**
          1. **Unique Approach:** {{unique_approach}}
          2. **Exclusive Insight:** {{exclusive_insight}}
          3. **Proprietary Method:** {{proprietary_method}}
          4. **Superior Delivery:** {{superior_delivery}}

          **Competitive Advantages:**
          - **vs. Competitor Type 1:** {{advantage_vs_competitor_1}}
          - **vs. Competitor Type 2:** {{advantage_vs_competitor_2}}
          - **vs. DIY Approaches:** {{advantage_vs_diy}}

          **"Only We" Statement:**
          {{only_we_statement}}

  - id: rocket-clarity-content-optimization
