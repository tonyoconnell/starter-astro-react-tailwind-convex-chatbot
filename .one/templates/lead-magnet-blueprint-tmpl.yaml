      Ensure content demonstrates unique mechanism and builds toward core offer.
    elicit: true
    custom_elicitation: clarity-optimization
    sections:
      - id: content-structure-framework
        title: Content Structure & Flow Framework
        conditional:
          digital:
            template: |
              **Digital Lead Magnet Structure:**

              **Title & Headline:**
              - **Main Title:** {{main_title}}
              - **Subtitle:** {{subtitle}}
              - **Benefit-Driven Headline:** {{benefit_headline}}

              **Content Architecture:**
              1. **Opening Hook ({{hook_word_count}} words)**
                 - Problem agitation: {{problem_agitation}}
                 - Promise preview: {{promise_preview}}
                 - Credibility establishment: {{credibility_hook}}

              2. **Core Content Sections:**
                 - **Section 1:** {{section_1_title}} ({{section_1_content_type}})
                 - **Section 2:** {{section_2_title}} ({{section_2_content_type}})
                 - **Section 3:** {{section_3_title}} ({{section_3_content_type}})
                 - **Section 4:** {{section_4_title}} ({{section_4_content_type}})

              3. **Unique Mechanism Integration:**
                 {{mechanism_integration_strategy}}

              4. **Transition to Next Step:**
                 {{transition_strategy}}

              **Visual Elements:**
              - **Charts/Graphs:** {{visual_elements_charts}}
              - **Worksheets/Templates:** {{visual_elements_worksheets}}
              - **Infographics:** {{visual_elements_infographics}}
          physical:
            template: |
              **Physical Lead Magnet Structure:**

              **Physical Format:** {{physical_format}}
              **Packaging Strategy:** {{packaging_approach}}

              **Content Components:**
              1. **Primary Component:** {{primary_component}}
                 - Purpose: {{primary_component_purpose}}
                 - User interaction: {{primary_interaction}}

              2. **Supporting Components:**
                 - **Component A:** {{supporting_component_a}}
                 - **Component B:** {{supporting_component_b}}
                 - **Component C:** {{supporting_component_c}}

              **Unique Mechanism Demonstration:**
              {{physical_mechanism_demonstration}}

              **Digital Integration:**
              {{digital_integration_strategy}}

      - id: messaging-optimization
        title: Messaging & Copy Optimization
        template: |
          **Core Messages:**
          1. **Primary Message:** {{primary_message}}
          2. **Supporting Message 1:** {{supporting_message_1}}
          3. **Supporting Message 2:** {{supporting_message_2}}
