          - **Call-to-Action Language:** {{cta_language_examples}}

          **Emotional Trigger Points:**
          - **Pain Amplification:** {{pain_amplification_messaging}}
          - **Desire Enhancement:** {{desire_enhancement_messaging}}
          - **Urgency Creation:** {{urgency_creation_messaging}}
          - **Trust Building:** {{trust_building_messaging}}

      - id: conversion-optimization
        title: Conversion Elements & Optimization
        template: |
          **Primary Call-to-Action:**
          - **CTA Text:** {{primary_cta_text}}
          - **CTA Placement:** {{cta_placement_strategy}}
          - **CTA Design:** {{cta_design_requirements}}

          **Secondary CTAs:**
          1. {{secondary_cta_1}} - Placement: {{secondary_cta_1_placement}}
          2. {{secondary_cta_2}} - Placement: {{secondary_cta_2_placement}}

          **Conversion Path Optimization:**
          - **Landing Page Elements:** {{landing_page_elements}}
          - **Form Optimization:** {{form_optimization_strategy}}
          - **Thank You Page Strategy:** {{thank_you_page_strategy}}

