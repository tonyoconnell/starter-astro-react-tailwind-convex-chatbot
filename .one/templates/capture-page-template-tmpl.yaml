# Advanced template configuration and validation
variables:
  headline_variants:
    type: array
    min_items: 3
    max_items: 5
    description: "Multiple headline variations for A/B testing"
    validation:
      - benefit_clarity: "Each headline must clearly communicate primary benefit"
      - psychological_trigger: "Must include psychological trigger (curiosity, fear, aspiration, etc.)"
      - target_audience_focus: "Must speak directly to target avatar language and needs"
      - measurable_outcome: "Should include specific, measurable outcomes when possible"

  form_fields:
    type: object
    properties:
      primary_fields:
        type: array
        max_items: 3
        description: "Essential fields for initial capture"
      progressive_fields:
        type: array
        max_items: 5
        description: "Additional fields for progressive profiling"
      field_specifications:
        type: object
        description: "Technical and UX specifications for each field"
    validation:
      - conversion_optimization: "Primary fields must be minimized for maximum conversion"
      - progressive_strategy: "Progressive profiling must provide value exchange"
      - mobile_optimization: "All fields must be mobile-friendly and thumb-accessible"

  social_proof:
    type: object
    properties:
      testimonials:
        type: array
        min_items: 2
        description: "Customer testimonials with results and attribution"
      statistics:
        type: object
        description: "Quantified social proof (user counts, success rates, etc.)"
      authority_indicators:
        type: array
        description: "Credibility signals (media mentions, certifications, etc.)"
    validation:
      - authenticity_verification: "All social proof must be genuine and verifiable"
      - relevance_alignment: "Social proof must be relevant to target audience"
      - visual_integration: "Must integrate naturally with page design"

  mobile_optimization:
    type: object
    properties:
      touch_targets:
        type: object
        description: "Touch target sizes and spacing for mobile interaction"
      performance_specs:
        type: object
        description: "Mobile performance requirements and optimization"
      ux_adaptations:
        type: object
        description: "Mobile-specific UX adaptations and enhancements"
    validation:
      - thumb_friendly_design: "All interactive elements must be thumb-accessible"
      - performance_standards: "Must meet mobile performance benchmarks"
      - cross_device_consistency: "Experience must be consistent across devices"

  conversion_psychology:
    type: object
    properties:
      cognitive_biases:
        type: array
        min_items: 3
        description: "Cognitive biases leveraged for conversion optimization"
      emotional_triggers:
        type: array
        min_items: 2
        description: "Emotional triggers integrated into copy and design"
      persuasion_principles:
        type: array
        min_items: 4
        description: "Cialdini principles and other persuasion techniques"
    validation:
      - ethical_application: "All psychological techniques must be applied ethically"
      - audience_alignment: "Triggers must align with target audience psychology"
