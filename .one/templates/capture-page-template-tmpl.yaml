template:
  id: capture-page-template-v1
  name: Lead Capture Page Template - Elevate Marketing
  version: 1.0
  output:
    format: markdown
    filename: "docs/{{company_name}}-{{page_name}}-capture-page.md"
    title: "{{page_name}} - High-Converting Capture Page Blueprint"

workflow:
  mode: interactive
  elicitation: rocket-framework
  custom_elicitation:
    title: "R.O.C.K.E.T. Framework Capture Page Optimization"
    sections:
      - id: research-conversion-psychology
        options:
          - "Audience psychology deep dive - behavior patterns, motivations, friction points"
          - "Conversion barrier analysis - technical, emotional, and cognitive obstacles"
          - "Trust and credibility requirements - what builds immediate confidence"
          - "Mobile behavior analysis - touch patterns, attention spans, device preferences"
          - "Value perception research - how audience evaluates offers and commitments"
          - "Decision trigger analysis - what prompts immediate action vs hesitation"
          - "Competitive landscape review - what others are doing and gaps in market"
          - "Proceed to opportunity optimization"
      - id: opportunity-page-optimization
        options:
          - "Headline optimization testing - benefit vs curiosity vs problem-focused approaches"
          - "Form field optimization - minimal capture vs progressive profiling strategies"
          - "Layout and flow optimization - single column vs multi-column effectiveness"
          - "Social proof optimization - testimonials, numbers, authority positioning"
          - "Trust element optimization - security badges, privacy assurances, guarantees"
          - "Call-to-action optimization - button copy, color, placement, urgency"
          - "Mobile experience optimization - thumb-friendly design, load speed, simplicity"
          - "Proceed to clarity refinement"
      - id: clarity-messaging-optimization
        options:
          - "Value proposition clarity - ensuring immediate understanding of benefit"
          - "Copy simplification - reducing cognitive load while maintaining persuasion"
          - "Visual hierarchy optimization - guiding eye movement toward conversion"
          - "Error handling clarity - making form completion effortless"
          - "Microcopy optimization - field labels, button text, privacy notes"
          - "Progress indication clarity - setting expectations for multi-step processes"
          - "Success confirmation optimization - celebrating conversion and next steps"
          - "Proceed to implementation planning"

sections:
  - id: template-overview
    title: Capture Page Template Overview (Elevate Framework IDENTIFY Step)
    instruction: |
      This template creates high-converting landing pages optimized for the IDENTIFY step of the Elevate Framework,
      facilitating the crucial transition from interest to known lead through ethical, low-friction contact capture.
      
      The template leverages the IDENTIFY methodology principles:
      - Value proposition reinforcement (remind WHY they're providing information)
      - Friction minimization (ridiculously easy opt-in process)
      - Trust building and security assurance (earn the right to communicate)
      - Expectation management (immediate GIFT delivery fulfillment)
      - Strategic tagging for nurture sequence optimization
      - Psychological transition from anonymous visitor to identified prospect
      
      Key Principle: This isn't merely technical data collection—it's a delicate psychological transition
      where you earn the right to enter their communication sphere by making the exchange feel fair, easy, and secure.
      
      The template includes:
      - Conversion-optimized page layouts with mobile-first design
      - Foundation Blueprint integration for avatar-specific optimization
      - Psychological trigger integration for maximum persuasion
      - Form optimization strategies for minimal friction
      - Trust-building elements and social proof frameworks
      - Value equation reinforcement throughout the experience
      - A/B testing protocols for continuous improvement
      - Technical optimization for speed and accessibility
      
      Output file location: `docs/{{company_name}}-{{page_name}}-capture-page.md`

