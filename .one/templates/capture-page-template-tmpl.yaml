  - id: page-architecture-optimization
    title: Page Architecture & Layout Optimization
    instruction: |
      Design page architecture optimized for conversion using proven layout patterns.
      Apply conversion psychology and UX principles for maximum effectiveness.
    elicit: true
    custom_elicitation: opportunity-page-optimization
    sections:
      - id: layout-strategy
        title: Page Layout Strategy & Visual Hierarchy
        conditional:
          simple_capture:
            template: |
              **Simple Capture Layout Strategy:**
              
              **Layout Type:** Single Column, Minimal Distraction
              **Optimal For:** High-intent traffic, simple offers, mobile-first experience
              
              **Visual Hierarchy Flow:**
              1. **Attention Grabber (0-3 seconds)**
                 - Headline: {{headline_primary}}
                 - Visual Hook: {{visual_hook_element}}
                 - Immediate Value: {{immediate_value_preview}}
              
              2. **Value Communication (3-10 seconds)**
                 - Subheadline: {{subheadline_copy}}
                 - Benefit Bullets: {{benefit_bullet_points}}
                 - Social Proof Indicator: {{social_proof_element}}
              
              3. **Conversion Focus (10-30 seconds)**
                 - Form Fields: {{form_field_configuration}}
                 - Submit Button: {{submit_button_design}}
                 - Trust Indicators: {{trust_element_placement}}
              
              **Content Hierarchy:**
              ```
              [Logo] ← Minimal branding
              
              [Headline - 48px+] ← Primary attention
              [Subheadline - 24px] ← Value clarification
              
              [Hero Visual/Preview] ← Tangible representation
              
              [Benefit Bullets] ← Quick value scan
              • {{benefit_1}}
              • {{benefit_2}}
              • {{benefit_3}}
              
              [Social Proof Bar] ← Validation
              
              [Form Section]
              {{form_headline}}
              [Email Field]
              [Optional Field]
              [Submit Button]
              🔒 {{privacy_assurance}}
              
              [Secondary Trust Elements]
              ```
          multi_step_capture:
            template: |
              **Multi-Step Capture Layout Strategy:**
              
              **Layout Type:** Progressive Disclosure, Guided Experience
              **Optimal For:** High-value offers, qualification needed, complex products
              
              **Step Progression Framework:**
              
              **Step 1: Value & Engagement**
              - Headline: {{step_1_headline}}
              - Value Proposition: {{step_1_value_prop}}
              - Engagement Mechanism: {{step_1_engagement}}
              - Progress Indicator: {{step_1_progress}}
              
              **Step 2: Basic Information**
              - Mini-headline: {{step_2_headline}}
              - Form Fields: {{step_2_fields}}
              - Progress Indicator: {{step_2_progress}}
              - Back Option: {{step_2_back_option}}
              
              **Step 3: Qualification/Personalization**
              - Context Headline: {{step_3_headline}}
              - Qualification Questions: {{step_3_questions}}
              - Progress Indicator: {{step_3_progress}}
              - Skip Option: {{step_3_skip_option}}
              
              **Step 4: Confirmation & Delivery**
              - Success Message: {{step_4_success_message}}
              - Next Steps: {{step_4_next_steps}}
              - Additional Offers: {{step_4_additional_offers}}
              - Community/Social Links: {{step_4_social_elements}}
              
              **Conversion Psychology Integration:**
              - Commitment Escalation: {{commitment_escalation_strategy}}
              - Progress Momentum: {{progress_momentum_techniques}}
              - Abandonment Prevention: {{abandonment_prevention_methods}}

      - id: headline-optimization-framework
        title: Headline & Copy Optimization Framework
        template: |
          **Primary Headline Strategy:**
          - Formula Used: {{headline_formula_choice}}
          - Primary Headline: {{primary_headline}}
          - Headline Variants for Testing: 
            1. {{headline_variant_1}}
            2. {{headline_variant_2}}
            3. {{headline_variant_3}}
          
          **Subheadline Framework:**
          - Supporting Message: {{subheadline_primary}}
          - Objection Addressing: {{objection_addressing_copy}}
          - Urgency/Scarcity Element: {{urgency_scarcity_element}}
          
          **Copy Formula Templates:**
          
          **Benefit-Driven Formula:**
          ```
          [Get/Discover/Learn] [Specific Outcome] [Time Frame/Method]
          
          Current Application:
          Headline: {{benefit_driven_headline}}
          Subheadline: {{benefit_driven_subheadline}}
          Supporting Copy: {{benefit_driven_copy}}
          ```
          
          **Problem-Solution Formula:**
          ```
          [Problem Agitation] + [Solution Introduction] + [Proof Element]
          
          Current Application:
          Headline: {{problem_solution_headline}}
          Subheadline: {{problem_solution_subheadline}}
          Supporting Copy: {{problem_solution_copy}}
          ```
          
          **Curiosity Gap Formula:**
          ```
          [Intriguing Statement] + [Partial Reveal] + [Access Promise]
          
          Current Application:
          Headline: {{curiosity_gap_headline}}
          Subheadline: {{curiosity_gap_subheadline}}
          Supporting Copy: {{curiosity_gap_copy}}
          ```
          
          **Copy Optimization Elements:**
          - Reading Level: {{target_reading_level}}
          - Emotional Triggers: {{emotional_trigger_words}}
          - Power Words: {{power_words_integration}}
          - Call-to-Action Language: {{cta_language_strategy}}

      - id: form-optimization-strategy
        title: Form Field Optimization & Friction Minimization (IDENTIFY Principles)
        template: |
          **Form Strategy Overview (IDENTIFY Framework):**
          - Capture Approach: {{form_capture_approach}}
          - Field Minimization: {{field_minimization_strategy}}
          - Progressive Profiling: {{progressive_profiling_plan}}
          - Conversion vs Data Trade-off: {{conversion_data_balance}}
          
          **IDENTIFY Key Principles Integration:**
          
          **1. Minimize Friction (Crucial for IDENTIFY Success):**
          - **Fewest Possible Fields:** Ask only for what's absolutely essential (usually just email)
          - **Clear Instructions:** Make it obvious what information goes where
          - **Seamless Flow:** Immediate, logical transition from GIFT interest to information request
          - **Ridiculously Easy:** Every extra click/field dramatically increases drop-off
          
          **2. Value Proposition Reinforcement:**
          - **Benefit Reminder:** Subtly remind why they're providing information
          - **GIFT Value Emphasis:** Clear connection between email and receiving valuable GIFT
          - **Fair Exchange:** Perceived benefit must clearly outweigh perceived "cost"
          
          **3. Trust & Security Assurance:**
          - **Privacy Policy Link:** Essential for building trust
          - **Data Security Indicators:** Reassure users their data is safe
          - **Usage Transparency:** Clear indication of how information will be used
          
          **Primary Form Configuration:**
          
          **Stage 1: Initial Capture (IDENTIFY Optimized)**
          - **Primary Field:** Email Address (Required)
          - **Optional Field:** First Name ({{first_name_inclusion_decision}})
          - **Field Justification:** {{field_inclusion_rationale}}
          - **Submit Button Text:** {{submit_button_text}}
          
          **Form Copy Optimization (IDENTIFY Framework):**
          - **Form Headline:** "{{form_headline_gift_connection}}"
          - **Value Reinforcement:** "{{value_reinforcement_copy}}"
          - **Privacy Assurance:** "{{privacy_assurance_microcopy}}"
          - **Call-to-Action:** "{{optimized_cta_copy}}"
          
          **Form Design Specifications:**
          - Form Width: {{form_width_specification}}
          - Field Height: {{field_height_specification}}
          - Font Size: {{form_font_size}}
          - Input Type Optimization: {{input_type_optimization}}
          - Placeholder Strategy: {{placeholder_text_strategy}}
          
          **Validation & Error Handling:**
          - Inline Validation: {{inline_validation_approach}}
          - Error Messages: {{error_message_strategy}}
          - Success Feedback: {{success_feedback_approach}}
          - Auto-complete Support: {{autocomplete_configuration}}
          
          **Trust Building Elements:**
          - **Security Indicators:** {{security_indicator_placement}}
          - **Privacy Statement:** {{privacy_statement_positioning}}
          - **Data Usage Clarity:** {{data_usage_explanation}}
          - **Unsubscribe Freedom:** {{unsubscribe_assurance}}
          
          **Progressive Enhancement:**
          
          **Stage 2: Follow-up Profiling (Post-IDENTIFY)**
          - Additional Fields: {{stage_2_additional_fields}}
          - Trigger Conditions: {{stage_2_trigger_conditions}}
          - Collection Method: {{stage_2_collection_method}}
          - Value Exchange: {{stage_2_value_exchange}}
          
          **Mobile Form Optimization:**
          - Touch Target Size: {{mobile_touch_target_size}}
          - Keyboard Optimization: {{mobile_keyboard_optimization}}
          - Single Column Layout: {{mobile_layout_considerations}}
          - Thumb-Friendly Spacing: {{mobile_spacing_requirements}}

  - id: identify-system-integration
    title: IDENTIFY System Integration & Automation
    instruction: |
      Implement system integration and automation for seamless IDENTIFY process.
      Ensure captured data flows into proper systems with appropriate tagging for nurture sequences.
    sections:
      - id: capture-mechanism-optimization
        title: Capture Mechanism Design & Optimization
        template: |
          **Capture Mechanism Selection:**
          
          **Standard Inline Form (Recommended for Most Cases):**
          - **Placement:** Directly on GIFT landing page
          - **Benefits:** Simple, clear, effective
          - **Optimization:** Keep brief and focused
          - **Best For:** {{inline_form_best_use_cases}}
          
          **Two-Step Opt-in (Button → Popup):**
          - **Process:** Button reveals form in popup/modal
          - **Benefits:** Higher initial engagement
          - **Considerations:** Adds step, ensure popup is dismissible
          - **Best For:** {{two_step_best_use_cases}}
          
          **Chatbot Interaction:**
          - **Process:** Conversational flow leading to email request
          - **Benefits:** Natural feel, high engagement
          - **Integration:** "Where can I send your results?"
          - **Best For:** {{chatbot_best_use_cases}}
          
          **Selected Mechanism:** {{selected_capture_mechanism}}
          **Selection Rationale:** {{mechanism_selection_rationale}}
          
          **Ask Copy Optimization:**
          
          **Clear & Concise Options:**
          - "Enter your email to get the {{gift_name}}"
          - "Get instant access to {{gift_name}} by entering your email below"
          - "Where should I send your {{gift_name}}?"
          - "Send me the {{gift_name}} → [Email Field]"
          
          **Selected Ask Copy:** "{{selected_ask_copy}}"
          
          **Trust Building Micro-Copy:**
          - Privacy Assurance: "{{privacy_micro_copy}}"
          - Spam Prevention: "{{spam_prevention_copy}}"
          - Unsubscribe Freedom: "{{unsubscribe_freedom_copy}}"
      - id: system-integration-framework
        title: System Integration & Data Flow
        template: |
          **ESP/CRM Connection Strategy:**
          
          **Email Service Provider Integration:**
          - **Platform:** {{email_platform_selection}}
          - **Connection Method:** {{esp_connection_method}}
          - **Reliability Requirements:** {{esp_reliability_standards}}
          - **Backup Systems:** {{esp_backup_strategy}}
          
          **CRM Integration (if applicable):**
          - **CRM Platform:** {{crm_platform_selection}}
          - **Data Mapping:** {{crm_data_mapping_strategy}}
          - **Lead Routing:** {{crm_lead_routing_setup}}
          - **Duplicate Handling:** {{crm_duplicate_prevention}}
          
          **Strategic Tagging Framework (Critical for NURTURE):**
          
          **Tag Structure Strategy:**
          - **GIFT Source Tag:** `{{gift_source_tag_format}}`
          - **Campaign Tag:** `{{campaign_tag_format}}`
          - **Channel Tag:** `{{channel_tag_format}}`
          - **Avatar Segment Tag:** `{{avatar_segment_tag}}`
          
          **Example Tagging:**
          ```
          Lead Source: GIFT_ConversionChecklist_Facebook_2024Q1
          Avatar: BusyEcomOwner
          Campaign: Q1_LeadGen_Campaign
          Channel: Facebook_Ads
          ```
          
          **Immediate Delivery/Welcome Automation:**
          
          **Welcome Email Configuration:**
          - **Trigger:** Immediate upon successful opt-in
          - **Subject Line Options:**
            - "{{welcome_subject_option_1}}"
            - "{{welcome_subject_option_2}}"
          - **Content Requirements:**
            - Warm welcome message
            - GIFT delivery (link or access)
            - Future communication expectations
          
          **Delivery Process:**
          1. **Form Submission** → **ESP/CRM Addition** → **Tagging Applied** → **Welcome Email Triggered**
          2. **Immediate Access:** {{immediate_access_method}}
          3. **Backup Delivery:** {{backup_delivery_strategy}}
      - id: tracking-compliance-framework
        title: Tracking, Analytics & Compliance
        template: |
          **Conversion Tracking Setup:**
          
          **Analytics Configuration:**
          - **Google Analytics 4:** {{ga4_conversion_setup}}
