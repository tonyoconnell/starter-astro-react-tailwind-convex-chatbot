# Advanced template configuration
variables:
  strategic_context:
    type: object
    properties:
      sequence_type:
        type: string
        description: "Type of engagement sequence (onboarding, nurture, conversion, retention, etc.)"
        required: true
      business_objectives:
        type: array
        description: "Primary business objectives for the engagement sequence"
        min_items: 1
        max_items: 5
      target_customer_segments:
        type: array
        description: "Customer segments targeted by this sequence"
        min_items: 1
      journey_stage_focus:
        type: string
        enum: ["awareness", "consideration", "decision", "retention", "expansion"]
        description: "Primary customer journey stage for this sequence"
    validation:
      - context_alignment: "Strategic context must align with business objectives"
      - segment_specificity: "Target segments must be clearly defined"
      - journey_stage_appropriate: "Sequence design must match journey stage needs"

  trigger_events:
    type: array
    description: "Comprehensive trigger event definitions"
    min_items: 3
    max_items: 15
    items:
      type: object
      properties:
        trigger_name:
          type: string
          description: "Descriptive name for the trigger event"
        trigger_category:
          type: string
          enum: ["behavioral", "temporal", "contextual", "engagement", "lifecycle"]
        priority_score:
          type: number
          min: 1
          max: 10
          description: "Priority scoring for trigger importance"
        conditions:
          type: object
          description: "Trigger condition definitions and logic"
        response_mapping:
          type: object
          description: "Response template and action mapping"
    validation:
      - trigger_completeness: "All trigger events must have complete condition logic"
      - priority_distribution: "Trigger priorities should be distributed across score range"
      - response_alignment: "Trigger responses must align with business objectives"

  response_templates:
    type: object
    properties:
      template_categories:
        type: array
        description: "Categories of response templates"
        min_items: 4
      personalization_levels:
        type: array
        description: "Levels of personalization available"
        min_items: 3
      dynamic_elements:
        type: array
        description: "Dynamic content elements for real-time customization"
        min_items: 5
      quality_standards:
        type: object
        description: "Quality standards for template creation and usage"
    validation:
      - template_coverage: "Templates must cover all major engagement scenarios"
      - personalization_depth: "Personalization must be meaningful and data-driven"
      - quality_consistency: "All templates must meet established quality standards"

  escalation_paths:
    type: array
    description: "Escalation pathway definitions"
    min_items: 3
    max_items: 8
    items:
      type: object
      properties:
        escalation_name:
          type: string
          description: "Name of the escalation pathway"
        trigger_criteria:
          type: object
          description: "Criteria that trigger this escalation"
        routing_logic:
          type: object
          description: "Logic for routing escalated engagements"
        sla_requirements:
          type: object
          description: "Service level agreement requirements"
        quality_assurance:
          type: object
          description: "Quality assurance measures for escalations"
    validation:
      - escalation_completeness: "All escalation paths must have complete routing logic"
      - sla_realistic: "SLA requirements must be realistic and achievable"
      - quality_maintained: "Quality standards must be maintained in escalations"

engagement_sequence_types:
  onboarding:
    focus: "New customer introduction and value realization"
    typical_duration: "30-90 days"
    key_metrics: ["activation_rate", "time_to_value", "engagement_depth"]
    channels: ["email", "in_app", "sms", "phone"]
  
  nurture:
    focus: "Relationship building and trust development"
    typical_duration: "60-180 days"
    key_metrics: ["engagement_rate", "content_consumption", "lead_scoring"]
    channels: ["email", "content", "social", "webinars"]
  
  conversion:
    focus: "Sales conversion and decision acceleration"
    typical_duration: "7-30 days"
    key_metrics: ["conversion_rate", "sales_velocity", "deal_size"]
    channels: ["email", "phone", "direct_mail", "retargeting"]
  
  retention:
    focus: "Customer success and churn prevention"
    typical_duration: "Ongoing"
    key_metrics: ["retention_rate", "satisfaction_score", "usage_metrics"]
    channels: ["email", "in_app", "customer_success", "community"]
  
  expansion:
    focus: "Upsell and cross-sell opportunities"
    typical_duration: "30-90 days"
    key_metrics: ["expansion_revenue", "account_growth", "feature_adoption"]
    channels: ["email", "in_app", "account_management", "events"]

channel_capabilities:
  email:
    strengths: ["detailed_content", "personalization", "automation", "tracking"]
    limitations: ["deliverability", "attention_competition", "mobile_formatting"]
    optimization_factors: ["subject_lines", "send_timing", "content_length", "cta_placement"]
  
  sms:
    strengths: ["immediacy", "high_open_rates", "mobile_native", "urgency"]
    limitations: ["character_limits", "compliance", "frequency_sensitivity", "cost"]
    optimization_factors: ["timing", "brevity", "personalization", "link_strategy"]
  
  phone:
    strengths: ["personal_connection", "complex_conversations", "immediate_feedback", "relationship_building"]
    limitations: ["scalability", "cost", "availability_matching", "compliance"]
    optimization_factors: ["timing", "script_quality", "agent_training", "follow_up"]
  
  social_media:
    strengths: ["engagement", "community", "viral_potential", "brand_building"]
    limitations: ["algorithm_dependence", "platform_changes", "resource_intensive", "measurement"]
    optimization_factors: ["content_quality", "timing", "hashtag_strategy", "community_management"]
  
  direct_mail:
    strengths: ["tangible_impact", "attention_getting", "personalization", "integration"]
    limitations: ["cost", "response_time", "environmental_concerns", "tracking"]
    optimization_factors: ["design_quality", "personalization", "timing", "digital_integration"]

llm_assistance_capabilities:
  real_time_guidance:
    content_optimization: "Dynamic content improvement suggestions"
    tone_adaptation: "Real-time tone adjustment based on context"
    personalization: "Dynamic personalization based on user data"
    quality_assurance: "Automated quality checking and improvement"
  
  decision_support:
    escalation_decisions: "AI-powered escalation routing decisions"
    channel_selection: "Optimal channel recommendation"
    timing_optimization: "Best timing prediction for engagement"
    content_selection: "Most effective content variant selection"
  
  performance_prediction:
    engagement_likelihood: "Prediction of engagement success probability"
    conversion_prediction: "Likelihood of conversion for each interaction"
    optimal_frequency: "Prediction of optimal engagement frequency"
    churn_risk_assessment: "Real-time churn risk evaluation"

quality_validation_framework:
  sequence_completeness:
    - trigger_coverage: "All relevant trigger events must be identified and defined"
    - response_comprehensiveness: "Response templates must cover all engagement scenarios"
    - channel_optimization: "Each channel must be optimized for its unique strengths"
    - escalation_clarity: "Escalation paths must be clear and actionable"
  
  performance_orientation:
    - metrics_measurable: "All success metrics must be quantifiable and trackable"
    - benchmarks_realistic: "Performance benchmarks must be achievable yet ambitious"
    - optimization_systematic: "Optimization processes must be systematic and data-driven"
    - roi_focused: "All activities must contribute to measurable business outcomes"
  
  implementation_readiness:
    - resource_allocation: "Required resources must be clearly identified and allocated"
    - timeline_realistic: "Implementation timeline must be realistic and achievable"
    - dependencies_managed: "All dependencies must be identified and managed"
    - risk_mitigation: "Major risks must be identified with mitigation strategies"
  
  technology_integration:
    - platform_compatibility: "All technology requirements must be compatible with existing systems"
    - scalability_planning: "System must be designed for growth and scalability"
    - security_compliance: "All security and compliance requirements must be met"
    - user_experience: "Technology implementation must enhance user experience"

conditional_logic:
  sequence_type:
    onboarding:
      focus_areas: ["activation", "value_realization", "habit_formation", "success_milestones"]
      critical_metrics: ["time_to_first_value", "feature_adoption", "engagement_consistency"]
    nurture:
      focus_areas: ["education", "trust_building", "preference_learning", "relationship_development"]
      critical_metrics: ["content_engagement", "lead_scoring_progression", "brand_affinity"]
