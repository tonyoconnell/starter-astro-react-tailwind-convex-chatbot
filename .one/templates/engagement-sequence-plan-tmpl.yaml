template:
  id: engagement-sequence-plan-template-v1
  name: Engagement Sequence Plan - Elevate Marketing
  version: 1.0
  output:
    format: markdown
    filename: "docs/{{company_name}}-{{sequence_type}}-engagement-plan.md"
    title: "{{sequence_type}} Engagement Sequence Plan - {{company_name}}"

workflow:
  mode: interactive
  elicitation: advanced-elicitation
  llm_assistance:
    real_time_guidance: true
    decision_support: true
    optimization_suggestions: true
    pattern_recognition: true
    performance_prediction: true
  custom_elicitation:
    title: "Engagement Sequence Design Actions"
    sections:
      - id: sequence-strategy-development
        options:
          - "Analyze customer journey stage and behavioral triggers using Elevate Framework friction point identification (shipping questions, checkout confusion, trust concerns, value re-evaluation)"
          - "Map engagement touchpoints across customer lifecycle with real-time assistance focus using proactive and reactive engagement modes"
          - "Identify conversation flow optimization opportunities using proactive and reactive engagement modes"
          - "Research personalization vectors and data points for PL (Perceived Likelihood) boosting and ES (Effort/Sacrifice) reduction using Elevate principles"
          - "Study competitive engagement strategies and gaps using Perceived Likelihood (PL) and Effort/Sacrifice (ES) analysis from Hormozi's Value Equation"
          - "Define automated vs human-hybrid decision criteria based on complexity, value tier, and risk assessment"
          - "Explore multi-channel orchestration possibilities (website chatbots, messaging apps, social media direct engagement, email near real-time responses)"
          - "Analyze engagement timing and frequency optimization using behavioral triggers and exit intent"
          - "Proceed to next section"
      - id: trigger-event-analysis
        options:
          - "Map behavioral trigger events using Elevate Framework friction points (shipping questions, checkout confusion, trust concerns, value re-evaluation)"
          - "Define engagement threshold criteria and scoring based on time on page, exit intent, idle time, and specific button clicks"
          - "Analyze real-time vs batch trigger processing needs for immediate assistance during purchase consideration"
          - "Research predictive trigger modeling opportunities using Elevate engagement patterns and persuasion principles"
          - "Study trigger event attribution and source tracking across website, social, and messaging channels"
          - "Explore trigger combination rules and logic for multi-signal engagement activation"
          - "Define trigger priority and escalation frameworks using customer value tier and complexity scoring"
          - "Map trigger-to-response matching algorithms for contextual FAQ, live chat, and proactive messaging"
          - "Proceed to next section"
      - id: conversation-flow-optimization
        options:
          - "Design conversation trees with dynamic branching"
          - "Optimize conversation context preservation"
          - "Develop personality-adaptive conversation styles"
          - "Create conversation goal achievement pathways"
          - "Design conversation hand-off protocols"
          - "Build conversation quality assessment frameworks"
          - "Explore conversation sentiment-based adaptations"
          - "Design conversation recovery and re-engagement flows"
          - "Proceed to next section"
      - id: performance-optimization-framework
        options:
          - "Design engagement effectiveness measurement systems"
          - "Create A/B testing frameworks for sequence variations"
          - "Develop predictive engagement scoring models"
          - "Build real-time optimization algorithms"
          - "Create engagement quality vs quantity balance"
          - "Design personalization effectiveness tracking"
          - "Build multi-channel attribution models"
          - "Create engagement ROI optimization frameworks"
          - "Proceed to final sequence plan"

sections:
  - id: sequence-overview
    title: Engagement Sequence Plan Overview
    instruction: |
      This plan creates comprehensive engagement sequences with LLM-powered real-time assistance for decision support.
      Focus on multi-channel orchestration, conversation flow design, and performance optimization.
      
      The sequence plan includes:
      - Intelligent trigger event detection and response
      - Dynamic conversation flows with AI assistance
      - Multi-channel engagement orchestration
      - Personalization frameworks and data utilization
      - Human-hybrid vs automated engagement logic
      - Performance tracking and optimization systems
      
      Output file location: `docs/{{company_name}}-{{sequence_type}}-engagement-plan.md`

  - id: sequence-strategy-framework
    title: Engagement Sequence Strategy & Context
    instruction: |
      Define overall engagement sequence strategy with LLM guidance for strategic alignment.
      Use strategic_context and engagement_goals variables for customization.
    sections:
      - id: sequence-objectives
        title: Sequence Objectives & Success Criteria
        template: |
          **Engagement Sequence Type:** {{sequence_type}}
          **Primary Business Objective:** {{primary_business_objective}}
          
          **Success Criteria Framework:**
          
          **Primary Success Metrics:**
          1. {{primary_success_metric}} - Target: {{primary_metric_target}}
          2. {{secondary_success_metric}} - Target: {{secondary_metric_target}}
          3. {{tertiary_success_metric}} - Target: {{tertiary_metric_target}}
          
          **Engagement Quality Indicators:**
          - Response Rate: {{target_response_rate}}
          - Conversation Completion: {{target_completion_rate}}
          - Sentiment Score: {{target_sentiment_score}}
          - Escalation Rate: {{target_escalation_rate}}
          
          **Business Impact Metrics:**
          - Conversion Rate: {{target_conversion_rate}}
          - Customer Lifetime Value Impact: {{target_ltv_impact}}
          - Cost Per Engagement: {{target_cost_per_engagement}}
          - Time to Value: {{target_time_to_value}}
      - id: customer-journey-alignment
        title: Customer Journey Stage Alignment
        conditional:
          awareness_stage:
            template: |
              **Customer Journey Stage:** Awareness
              **Engagement Strategy:** Educational and Value-Driven
              
              **Stage-Specific Considerations:**
              - Problem Recognition Level: {{problem_recognition_level}}
              - Information Seeking Behavior: {{information_seeking_patterns}}
              - Trust Building Requirements: {{trust_building_approach}}
              - Content Consumption Preferences: {{content_preferences}}
              
              **Engagement Approach (Elevate Framework - ENGAGE):**
              - Primary Goal: {{awareness_engagement_goal}}
              - Educational Content Mix: {{educational_content_strategy}}
              - Value Demonstration: {{value_demonstration_approach}}
              - Trust Building Tactics: {{trust_building_tactics}}
              - Friction Reduction Focus: Address common questions proactively (shipping, returns, compatibility)
              - Real-time Assistance: Chatbots and contextual help for immediate support during consideration phase
              - PL Boosting Elements: Security reassurance, guarantees, and support availability
              - ES Reduction Tactics: Instant answers via chatbot, clarifying costs upfront, simplifying complex info
              
              **Transition Triggers:**
              {{awareness_to_consideration_triggers}}
          consideration_stage:
            template: |
              **Customer Journey Stage:** Consideration
              **Engagement Strategy:** Solution-Focused and Comparative
              
              **Stage-Specific Considerations:**
              - Solution Evaluation Criteria: {{evaluation_criteria}}
              - Comparison Shopping Behavior: {{comparison_behavior}}
              - Decision Timeline: {{decision_timeline}}
              - Stakeholder Involvement: {{stakeholder_dynamics}}
              
              **Engagement Approach:**
              - Primary Goal: {{consideration_engagement_goal}}
              - Solution Positioning: {{solution_positioning_strategy}}
              - Objection Handling: {{objection_handling_approach}}
              - Social Proof Integration: {{social_proof_strategy}}
              
              **Transition Triggers:**
              {{consideration_to_decision_triggers}}
          decision_stage:
            template: |
              **Customer Journey Stage:** Decision
              **Engagement Strategy:** Conversion-Optimized and Urgency-Driven
              
              **Stage-Specific Considerations:**
              - Purchase Decision Factors: {{decision_factors}}
              - Risk Mitigation Needs: {{risk_mitigation_requirements}}
              - Urgency Drivers: {{urgency_factors}}
              - Final Evaluation Process: {{final_evaluation_process}}
              
              **Engagement Approach:**
              - Primary Goal: {{decision_engagement_goal}}
              - Conversion Optimization: {{conversion_optimization_strategy}}
              - Risk Reversal: {{risk_reversal_approach}}
              - Urgency Creation: {{urgency_creation_tactics}}
              
              **Transition Triggers:**
              {{decision_to_purchase_triggers}}
          retention_stage:
            template: |
              **Customer Journey Stage:** Retention/Nurture
              **Engagement Strategy:** Relationship-Building and Value-Reinforcement
              
              **Stage-Specific Considerations:**
              - Customer Success Indicators: {{success_indicators}}
              - Value Realization Timeline: {{value_realization_timeline}}
              - Expansion Opportunities: {{expansion_opportunities}}
              - Loyalty Building Factors: {{loyalty_factors}}
              
              **Engagement Approach:**
              - Primary Goal: {{retention_engagement_goal}}
              - Value Reinforcement: {{value_reinforcement_strategy}}
              - Success Acceleration: {{success_acceleration_approach}}
              - Relationship Deepening: {{relationship_building_tactics}}
              
              **Transition Triggers:**
              {{retention_to_expansion_triggers}}
      - id: channel-strategy-overview
        title: Multi-Channel Engagement Strategy
        template: |
          **Channel Orchestration Philosophy:**
          {{channel_orchestration_approach}}
          
          **Primary Engagement Channels:**
          1. {{primary_channel}} - Role: {{primary_channel_role}}
          2. {{secondary_channel}} - Role: {{secondary_channel_role}}
          3. {{tertiary_channel}} - Role: {{tertiary_channel_role}}
          
          **Channel Coordination Framework:**
          - Message Consistency: {{message_consistency_approach}}
          - Context Preservation: {{context_preservation_method}}
          - Cross-Channel Attribution: {{attribution_tracking_approach}}
          - Channel Handoff Protocols: {{handoff_protocols}}
          
          **Channel-Specific Optimization:**
          {{channel_specific_optimizations}}

  - id: trigger-events-framework
    title: Trigger Events & Activation Logic
    instruction: |
      Define comprehensive trigger event framework with LLM assistance for pattern recognition.
      Use trigger_events variable to customize activation criteria and response logic.
    variables:
      - trigger_events
      - activation_criteria
    sections:
      - id: behavioral-triggers
        title: Behavioral Trigger Events
        instruction: Create comprehensive behavioral trigger framework with scoring and prioritization
        repeatable: true
        template: |
          **Trigger Event: {{trigger_event_name}}**
          **Category:** {{trigger_category}}
          **Priority Score:** {{trigger_priority_score}}/10
          
          **Trigger Conditions (Elevate Framework):**
          - Primary Condition: {{primary_trigger_condition}}
          - Secondary Conditions: {{secondary_trigger_conditions}}
          - Exclusion Criteria: {{trigger_exclusion_criteria}}
          - Time Window: {{trigger_time_window}}
          - Unanswered Specific Questions: Shipping details, return policies, product compatibility, material specifics
          - Checkout Complexity: Confusion about required fields, payment options, process flow
          - Trust & Security Flicker: Last-second payment security worries, legitimacy concerns
          - Value Re-Evaluation: "Is this worth it?" moments, competitor comparison urges
          - Trust Signal Needs: Security concerns, guarantee inquiries, return policy questions
          
          **Activation Logic:**
          ```
          IF {{primary_condition_logic}}
          AND {{secondary_condition_logic}}
          AND NOT {{exclusion_logic}}
          WITHIN {{time_window_logic}}
          THEN ACTIVATE {{trigger_response_type}}
          WITH PRIORITY {{trigger_priority}}
          ```
          
          **Trigger Scoring Algorithm (Enhanced with Elevate Principles):**
          - Recency Weight: {{recency_weight}} ({{recency_calculation}})
          - Frequency Weight: {{frequency_weight}} ({{frequency_calculation}})
          - Intent Strength: {{intent_strength}} ({{intent_calculation}}) - High intent = checkout proximity
          - Context Relevance: {{context_relevance}} ({{context_calculation}})
          - Friction Level: Purchase hesitation indicators and common objection signals
          - Trust Requirement: Security, guarantee, or credibility concerns
          - **Total Score: {{total_trigger_score}}**
          
          **Response Mapping:**
          - High Priority (8-10): {{high_priority_response}}
          - Medium Priority (5-7): {{medium_priority_response}}
          - Low Priority (1-4): {{low_priority_response}}
          
          **Data Sources:**
          {{trigger_data_sources}}
      - id: engagement-threshold-matrix
        title: Engagement Threshold & Escalation Matrix
        template: |
          **Engagement Threshold Framework:**
          
          **Automated Engagement Thresholds:**
          
          **Level 1: Light Touch Automation**
          - Trigger Score Range: {{level_1_score_range}}
          - Response Type: {{level_1_response_type}}
          - Personalization Level: {{level_1_personalization}}
          - Follow-up Logic: {{level_1_followup}}
          
          **Level 2: Medium Touch Automation**
          - Trigger Score Range: {{level_2_score_range}}
          - Response Type: {{level_2_response_type}}
          - Personalization Level: {{level_2_personalization}}
          - Follow-up Logic: {{level_2_followup}}
          
          **Level 3: High Touch Hybrid**
          - Trigger Score Range: {{level_3_score_range}}
          - Response Type: {{level_3_response_type}}
          - Human Involvement: {{level_3_human_involvement}}
          - Escalation Criteria: {{level_3_escalation}}
          
          **Escalation Pathways:**
          
          **Automated to Human Escalation:**
          - Trigger Conditions: {{automation_escalation_triggers}}
          - Handoff Process: {{handoff_process}}
          - Context Transfer: {{context_transfer_protocol}}
          - Response Time SLA: {{escalation_response_sla}}
          
          **Human Override Protocols:**
          {{human_override_framework}}
      - id: trigger-combination-logic
        title: Complex Trigger Combination Rules
        template: |
          **Multi-Trigger Scenarios:**
          
          **Trigger Combination Rules:**
          
          **Scenario 1: {{combination_scenario_1}}**
          - Trigger Combination: {{trigger_combo_1}}
          - Logic Operator: {{logic_operator_1}}
          - Weighted Scoring: {{weighted_scoring_1}}
          - Response Modification: {{response_modification_1}}
          
          **Scenario 2: {{combination_scenario_2}}**
          - Trigger Combination: {{trigger_combo_2}}
          - Logic Operator: {{logic_operator_2}}
          - Weighted Scoring: {{weighted_scoring_2}}
          - Response Modification: {{response_modification_2}}
          
          **Scenario 3: {{combination_scenario_3}}**
          - Trigger Combination: {{trigger_combo_3}}
          - Logic Operator: {{logic_operator_3}}
          - Weighted Scoring: {{weighted_scoring_3}}
          - Response Modification: {{response_modification_3}}
          
          **Trigger Conflict Resolution:**
          - Priority Resolution Method: {{priority_resolution_method}}
          - Timing Conflict Handling: {{timing_conflict_handling}}
          - Channel Conflict Resolution: {{channel_conflict_resolution}}
          
          **Trigger Suppression Rules:**
          {{trigger_suppression_framework}}

  - id: response-templates-framework
    title: Response Templates & Content Framework
    instruction: |
      Create comprehensive response template library with LLM-powered dynamic personalization.
      Use response_templates variable for template categorization and optimization.
    variables:
      - response_templates
      - personalization_data
    sections:
      - id: template-architecture
        title: Response Template Architecture
        template: |
          **Template System Overview:**
          
          **Template Hierarchy:**
          - Base Templates: {{base_template_count}} core frameworks
          - Variation Templates: {{variation_template_count}} personalized versions
          - Dynamic Elements: {{dynamic_element_count}} real-time customizations
          - Conditional Blocks: {{conditional_block_count}} context-dependent sections
          
          **Template Categories:**
          
          **1. Welcome & Onboarding Templates:**
          - First Contact: {{welcome_template_variations}}
          - Onboarding Sequence: {{onboarding_template_variations}}
          - Value Introduction: {{value_intro_variations}}
          
          **2. Educational & Nurture Templates:**
          - Problem Education: {{problem_education_variations}}
          - Solution Education: {{solution_education_variations}}
          - Value Demonstration: {{value_demo_variations}}
          
          **3. Conversion & Sales Templates:**
          - Objection Handling: {{objection_handling_variations}}
          - Social Proof: {{social_proof_variations}}
          - Urgency Creation: {{urgency_creation_variations}}
          
          **4. Retention & Success Templates:**
          - Success Celebration: {{success_celebration_variations}}
          - Value Reinforcement: {{value_reinforcement_variations}}
          - Expansion Opportunity: {{expansion_opportunity_variations}}
          
          **Template Selection Logic:**
          {{template_selection_algorithm}}
      - id: engagement-tools-tactics
        title: Engagement Tools & Tactics Framework (Elevate ENGAGE)
        template: |
          **Engagement Tools Framework (From Elevate Chapter 12):**
          
          **Reactive Engagement Tools:**
          - Live Chat: {{live_chat_strategy}} (Ideal for complex, nuanced queries requiring human interaction)
          - Chat Now Buttons: {{chat_button_placement}} (Strategic placement on high-intent pages)
          - Quick Query Forms: {{query_form_optimization}} (Simple submission for immediate response)
          - FAQ Access Points: {{faq_integration_strategy}} (Embedded help within page flow)
          
          **Proactive Engagement Tools:**
          - Behavioral Chatbots: {{behavioral_chatbot_config}} (Triggered by specific user actions)
          - Exit-Intent Popups: {{exit_intent_strategy}} (Offering assistance when users attempt to leave)
          - Time-Based Triggers: {{time_based_trigger_setup}} (e.g., after 60 seconds of inactivity)
          - Contextual Tooltips: {{contextual_tooltip_framework}} (Embedded explanations near potential confusion points)
          
          **Multi-Channel Engagement Framework:**
          - Website Integration: {{website_engagement_setup}} (Chatbots, contextual FAQs, live chat)
          - Messaging Apps: {{messaging_app_strategy}} (Facebook Messenger, Instagram DMs, WhatsApp responses)
          - Social Media Direct: {{social_media_engagement}} (Prompt responses to purchase-intent comments)
          - Email Near Real-Time: {{email_engagement_protocol}} (Rapid response to pre-sale inquiries)
          
          **Engagement Message Framework:**
          - Helpful Tone: {{helpful_tone_guidelines}} (Assistance-focused, not aggressive selling)
          - Brand Voice Consistency: {{brand_voice_engagement}} (Maintain established voice across channels)
          - Clear and Concise: {{message_clarity_standards}} (Immediate value delivery)
          - Trust Building: {{trust_building_messaging}} (Reassurance about security, guarantees, support)
          
          **Proactive Engagement Timing:**
          - Behavioral Triggers: {{proactive_timing_rules}} (Exit intent, idle time, specific page sections)
          - Relevance Focus: {{relevance_criteria}} (Helpful intervention, not interruption)
          - Channel Appropriateness: {{channel_timing_optimization}} (Respect platform norms and user expectations)
          
          **Engagement Performance Optimization:**
          {{engagement_tools_optimization_framework}}
      - id: dynamic-personalization
        title: Dynamic Personalization Framework
        sections:
          - id: personalization-data-points
            title: Personalization Data Points & Sources
            template: |
              **Primary Personalization Vectors:**
              
              **Demographic Personalization:**
              - Industry: {{industry_personalization_approach}}
              - Company Size: {{company_size_personalization}}
              - Role/Title: {{role_title_personalization}}
