              - Goal Alignment: {{goal_alignment_context}}
              
              **Data Source Integration:**
              {{personalization_data_sources}}
          - id: dynamic-content-generation
            title: Dynamic Content Generation Rules
            template: |
              **Content Personalization Engine:**
              
              **Real-Time Content Adaptation (Elevate Framework Integration):**
              - Subject Line Optimization: {{subject_line_personalization}}
              - Opening Personalization: {{opening_personalization_rules}}
              - Content Body Adaptation: {{content_body_personalization}} with focus on reducing ES (Effort/Sacrifice)
              - CTA Personalization: {{cta_personalization_approach}} emphasizing PL (Perceived Likelihood) boosting
              - Trust Signal Integration: Security badges, guarantees, and social proof contextually inserted
