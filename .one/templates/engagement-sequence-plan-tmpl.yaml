          **Template Performance Metrics:**
          {{template_performance_tracking}}

  - id: automation-hybrid-logic
    title: Automated vs Human-Hybrid Engagement Logic
    instruction: |
      Define sophisticated logic for determining when to use automation vs human involvement.
      Include LLM assistance for real-time decision making and escalation protocols.
    sections:
      - id: automation-decision-framework
        title: Automation Decision Framework
        template: |
          **Automation Suitability Matrix:**
          
          **Full Automation Criteria:**
          - Interaction Complexity Score: {{automation_complexity_threshold}}
          - Customer Value Tier: {{automation_value_threshold}}
          - Risk Level: {{automation_risk_threshold}}
          - Response Time Requirements: {{automation_timing_threshold}}
          
          **Automation Decision Tree:**
          ```
          Engagement Request Received
          ├── Complexity Analysis
          │   ├── Simple (Score 1-3) → Full Automation
          │   ├── Medium (Score 4-6) → Automation with Review
          │   └── Complex (Score 7-10) → Human Required
          ├── Value Tier Analysis
          │   ├── High Value → Human Touch Required
          │   ├── Medium Value → Hybrid Approach
          │   └── Standard Value → Automation Preferred
          └── Risk Assessment
              ├── High Risk → Human Oversight Required
              ├── Medium Risk → Automated with Monitoring
              └── Low Risk → Full Automation
          ```
          
          **Automation Confidence Scoring:**
          - Intent Recognition Confidence: {{intent_confidence_threshold}}
          - Response Appropriateness: {{response_confidence_threshold}}
          - Context Understanding: {{context_confidence_threshold}}
          - Outcome Prediction: {{outcome_confidence_threshold}}
          
          **Human Escalation Triggers:**
          {{human_escalation_criteria}}
      - id: hybrid-engagement-protocols
        title: Human-Hybrid Engagement Protocols
        sections:
          - id: handoff-protocols
            title: Automation-to-Human Handoff Protocols
            template: |
              **Seamless Handoff Framework:**
              
              **Handoff Trigger Conditions:**
              1. **Complexity Escalation**
                 - Condition: {{complexity_escalation_condition}}
                 - Trigger Score: {{complexity_trigger_score}}
                 - Handoff Type: {{complexity_handoff_type}}
              
              2. **Sentiment Escalation**
                 - Condition: {{sentiment_escalation_condition}}
                 - Trigger Score: {{sentiment_trigger_score}}
                 - Handoff Type: {{sentiment_handoff_type}}
              
              3. **Value Escalation**
                 - Condition: {{value_escalation_condition}}
                 - Trigger Score: {{value_trigger_score}}
                 - Handoff Type: {{value_handoff_type}}
              
              **Context Transfer Protocol:**
              - Conversation History: {{conversation_history_transfer}}
              - Customer Profile: {{customer_profile_transfer}}
              - Engagement Goals: {{goal_context_transfer}}
              - Previous Attempts: {{attempt_history_transfer}}
              - Recommended Approach: {{recommended_approach_transfer}}
              
              **Human Agent Briefing:**
              {{human_agent_briefing_template}}
          - id: human-oversight-framework
            title: Human Oversight & Quality Assurance
            template: |
              **Human Oversight Levels:**
              
              **Level 1: Automated with Monitoring**
              - Human Review: Post-engagement audit
              - Review Frequency: {{level_1_review_frequency}}
              - Quality Thresholds: {{level_1_quality_thresholds}}
              - Intervention Triggers: {{level_1_intervention_triggers}}
              
              **Level 2: Automated with Pre-Approval**
              - Human Review: Pre-send approval required
              - Review Timeline: {{level_2_review_timeline}}
              - Approval Criteria: {{level_2_approval_criteria}}
              - Emergency Override: {{level_2_override_protocol}}
              
              **Level 3: Human-Led with AI Support**
              - Human Role: Primary engagement owner
              - AI Support: Content suggestions and optimization
              - Decision Authority: {{level_3_decision_authority}}
              - Quality Assurance: {{level_3_quality_framework}}
              
              **Quality Assurance Metrics:**
              {{human_oversight_metrics}}
          - id: hybrid-optimization
            title: Hybrid Performance Optimization
            template: |
              **Hybrid Performance Framework:**
              
              **Automation Performance Tracking:**
              - Success Rate by Interaction Type: {{automation_success_tracking}}
              - Escalation Rate Analysis: {{escalation_rate_analysis}}
              - Customer Satisfaction: {{automation_satisfaction_tracking}}
              - Efficiency Metrics: {{automation_efficiency_metrics}}
              
              **Human Performance Integration:**
              - Human Agent Effectiveness: {{human_effectiveness_tracking}}
              - Hybrid Collaboration Metrics: {{collaboration_metrics}}
              - Knowledge Transfer: {{knowledge_transfer_tracking}}
              - Continuous Improvement: {{continuous_improvement_framework}}
              
              **Optimization Feedback Loops:**
              {{optimization_feedback_framework}}

  - id: conversation-flow-design
    title: Conversation Flow Design & Orchestration
    instruction: |
      Design sophisticated conversation flows with LLM assistance for dynamic adaptation.
      Focus on context preservation, goal achievement, and natural conversation progression.
    sections:
      - id: conversation-architecture
