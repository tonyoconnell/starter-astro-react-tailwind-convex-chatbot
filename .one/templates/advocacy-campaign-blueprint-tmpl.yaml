template:
  id: advocacy-campaign-blueprint-template-v1
  name: Advocacy Campaign Blueprint - Elevate Marketing
  version: 1.0
  output:
    format: markdown
    filename: "docs/{{company_name}}-{{campaign_type}}-advocacy-blueprint.md"
    title: "{{campaign_type}} Advocacy Campaign Blueprint - {{company_name}}"

workflow:
  mode: interactive
  elicitation: advanced-elicitation
  llm_assistance:
    real_time_guidance: true
    decision_support: true
    optimization_suggestions: true
    viral_mechanics_optimization: true
    community_building_focus: true
  custom_elicitation:
    title: "Advocacy Campaign Development Actions"
    sections:
      - id: advocacy-strategy-development
        options:
          - "Analyze customer advocacy potential and readiness indicators"
          - "Map advocacy touchpoints across customer success journey"
          - "Design advocate identification and segmentation strategies"
          - "Research advocacy motivation factors and reward psychology"
          - "Study viral trigger events and natural sharing moments"
          - "Explore community building opportunities and engagement tactics"
          - "Analyze competitive advocacy programs and differentiation"
          - "Design advocacy activation campaigns and recruitment funnels"
          - "Proceed to next section"
      - id: referral-system-architecture
        options:
          - "Design referral program mechanics and reward structures"
          - "Map referral journey from identification to conversion"
          - "Analyze optimal incentive models for target segments"
          - "Research friction reduction strategies for sharing"
          - "Study attribution tracking and performance measurement"
          - "Explore multi-tier reward systems and gamification"
          - "Design referral onboarding and activation sequences"
          - "Map referral lifecycle management and re-engagement"
          - "Proceed to next section"
      - id: viral-mechanics-design
        options:
          - "Design viral triggers and natural sharing moments"
          - "Map social currency creation and status enhancement"
          - "Analyze viral coefficient optimization strategies"
          - "Research network effects and exponential growth tactics"
          - "Study emotional amplification and sharing psychology"
          - "Explore content virality and shareability optimization"
          - "Design viral loops and self-reinforcing mechanisms"
          - "Map viral growth tracking and measurement systems"
          - "Proceed to next section"
      - id: community-ecosystem-design
        options:
          - "Design community platform and engagement architecture"
          - "Map community roles and hierarchy systems"
          - "Analyze community content strategy and programming"
          - "Research peer-to-peer advocacy and influence networks"
          - "Study community moderation and quality maintenance"
          - "Explore community events and exclusive experiences"
          - "Design community growth and scaling strategies"
          - "Map community value creation and member benefits"
          - "Proceed to campaign blueprint completion"

sections:
  - id: campaign-overview
    title: Advocacy Campaign Blueprint Overview
    instruction: |
      This advocacy campaign blueprint creates comprehensive referral systems and viral growth mechanisms.
      Focus on transforming satisfied customers into passionate advocates driving sustainable viral growth.
      
      The blueprint includes:
      - Customer advocacy identification and activation systems
      - Referral program architecture with optimized incentive structures
      - Viral mechanics design for exponential growth amplification
      - Community building frameworks for sustained engagement
      - Performance tracking and viral coefficient optimization
      - Conditional approaches for incentivized vs organic advocacy
      
      Output file location: `docs/{{company_name}}-{{campaign_type}}-advocacy-blueprint.md`

