# Advanced template configuration and validation
variables:
  referral_incentives:
    type: object
    properties:
      incentive_model:
        type: string
        enum: ["two_sided", "tiered", "points_based", "exclusive_access", "organic"]
        description: "Primary incentive model for referral program"
      reward_structure:
        type: object
        description: "Detailed reward structure and mechanics"
      motivation_drivers:
        type: array
        description: "Primary motivation drivers for advocacy behavior"
        min_items: 3
    validation:
      - incentive_alignment: "Incentives must align with target customer psychology"
      - reward_sustainability: "Reward structure must be economically sustainable"
      - motivation_authenticity: "Motivation drivers must feel authentic and valuable"

  sharing_mechanisms:
    type: array
    description: "Optimized sharing mechanisms across channels"
    min_items: 4
    max_items: 10
    items:
      type: object
      properties:
        mechanism_name:
          type: string
          min_length: 5
        channel_type:
          type: string
          enum: ["email", "social", "direct_link", "in_person", "mobile", "content"]
        friction_level:
          type: number
          min: 1
          max: 5
          description: "Friction level (1=frictionless, 5=high friction)"
        viral_potential:
          type: number
          min: 1
          max: 10
          description: "Viral potential score"
    validation:
      - friction_minimization: "All mechanisms must minimize sharing friction"
      - channel_optimization: "Each mechanism must be optimized for its channel"
      - viral_potential: "Mechanisms must have measurable viral potential"

  viral_triggers:
    type: array
    description: "Viral trigger events and psychological amplifiers"
    min_items: 5
    max_items: 15
    items:
      type: object
      properties:
        trigger_name:
          type: string
          min_length: 5
        emotional_driver:
          type: string
          enum: ["achievement", "pride", "helping", "status", "belonging", "surprise"]
        viral_potential:
          type: number
          min: 1
          max: 10
        implementation_complexity:
          type: string
          enum: ["low", "medium", "high"]
    validation:
      - emotional_authenticity: "Triggers must feel emotionally authentic"
      - viral_amplification: "Triggers must create natural sharing motivation"
      - implementation_feasibility: "Triggers must be implementable within constraints"

advocacy_campaign_types:
  referral_focused:
    characteristics: ["incentive_driven", "performance_tracked", "scalable_rewards"]
    key_metrics: ["viral_coefficient", "referral_conversion", "advocate_retention"]
    optimization_focus: ["incentive_optimization", "friction_reduction", "attribution_accuracy"]
  
  community_driven:
    characteristics: ["relationship_focused", "peer_influence", "long_term_engagement"]
    key_metrics: ["community_growth", "engagement_depth", "peer_advocacy_rate"]
    optimization_focus: ["community_health", "member_value", "peer_connections"]
  
  viral_growth:
    characteristics: ["exponential_focus", "network_effects", "rapid_scaling"]
    key_metrics: ["viral_coefficient", "growth_velocity", "network_density"]
    optimization_focus: ["viral_loop_optimization", "growth_acceleration", "momentum_maintenance"]
  
  organic_advocacy:
    characteristics: ["authentic_motivation", "intrinsic_rewards", "sustainable_growth"]
    key_metrics: ["advocate_satisfaction", "organic_sharing", "long_term_value"]
    optimization_focus: ["authentic_value", "natural_sharing", "relationship_depth"]

viral_mechanics_framework:
  trigger_categories:
    achievement_moments:
      examples: ["first_success", "milestone_reached", "goal_accomplished", "result_achieved"]
      optimization: ["timing_precision", "celebration_amplification", "social_currency"]
    
    social_currency:
      examples: ["expertise_demonstration", "insider_access", "status_enhancement", "value_sharing"]
      optimization: ["status_value", "shareability", "authenticity", "peer_recognition"]
    
    emotional_peaks:
      examples: ["surprise_delight", "exceeded_expectations", "exclusive_access", "personal_recognition"]
      optimization: ["emotional_intensity", "sharing_motivation", "positive_association", "memorable_experience"]
    
    community_wins:
      examples: ["group_achievement", "collective_success", "shared_celebration", "peer_recognition"]
      optimization: ["collective_pride", "shared_identity", "group_dynamics", "amplification_effect"]

referral_program_models:
  two_sided_rewards:
    structure: "Both referrer and referee receive benefits"
    benefits: ["mutual_value", "reduced_acquisition_cost", "higher_conversion"]
    considerations: ["cost_structure", "value_perception", "program_simplicity"]
  
  tiered_rewards:
