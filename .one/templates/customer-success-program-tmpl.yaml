template:
  id: customer-success-program-template-v1
  name: Customer Success Program - Elevate Marketing
  version: 1.0
  output:
    format: markdown
    filename: "docs/{{company_name}}-customer-success-program.md"
    title: "{{company_name}} Customer Success Program Framework"

workflow:
  mode: interactive
  elicitation: advanced-elicitation
  llm_assistance:
    real_time_guidance: true
    decision_support: true
    optimization_suggestions: true
    customer_lifecycle_focus: true
    value_realization_tracking: true
    retention_optimization: true
  custom_elicitation:
    title: "Customer Success Program Development Actions"
    sections:
      - id: customer-lifecycle-mapping
        options:
          - "Map complete customer lifecycle from onboarding to advocacy"
          - "Identify critical success milestones and value realization points"
          - "Design touchpoint optimization for relationship deepening"
          - "Analyze customer health indicators and early warning systems"
          - "Research customer success patterns and best practice frameworks"
          - "Study retention drivers and churn prevention strategies"
          - "Design proactive intervention and support systems"
          - "Map value delivery tracking and measurement systems"
          - "Proceed to next section"
      - id: feedback-systems-architecture
        options:
          - "Design comprehensive feedback collection across all touchpoints"
          - "Create closed-loop feedback systems for continuous improvement"
          - "Develop sentiment analysis and satisfaction measurement"
          - "Build voice of customer programs and insight generation"
          - "Design feedback-driven product and service optimization"
          - "Create customer advisory and co-creation opportunities"
          - "Map feedback integration into business decision processes"
          - "Design predictive feedback analysis and trend identification"
          - "Proceed to next section"
      - id: value-realization-optimization
        options:
          - "Map customer value realization pathways and milestones"
          - "Design outcome tracking and success measurement systems"
          - "Create value communication and reinforcement strategies"
          - "Build ROI demonstration and business case validation"
          - "Design expansion opportunity identification and activation"
          - "Map success story development and advocacy programs"
          - "Create value optimization and enhancement strategies"
          - "Design competitive differentiation through success delivery"
          - "Proceed to next section"
      - id: retention-loyalty-strategy
        options:
          - "Design proactive retention and loyalty enhancement programs"
          - "Create churn prediction and prevention systems"
          - "Build customer health scoring and intervention triggers"
          - "Design loyalty program architecture and reward systems"
          - "Map community building and peer connection strategies"
          - "Create advocacy development and referral programs"
          - "Design renewal optimization and expansion strategies"
          - "Build long-term relationship investment frameworks"
          - "Proceed to program completion"

sections:
  - id: program-overview
    title: Customer Success Program Overview
    instruction: |
      This Customer Success Program creates comprehensive post-purchase experience optimization with systematic value realization tracking and retention enhancement.
      Focus on proactive customer success management, continuous value delivery, and long-term relationship investment.
      
      The program includes:
      - Customer lifecycle management with proactive milestone tracking
      - Comprehensive feedback systems for continuous improvement
      - Value realization measurement and optimization frameworks
      - Retention and loyalty development programs
      - Advocacy and expansion opportunity management
      - Success team enablement and performance optimization
      
      Output file location: `docs/{{company_name}}-customer-success-program.md`

