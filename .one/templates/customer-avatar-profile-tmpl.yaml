# Advanced template configuration
variables:
  customer_pains:
    type: object
    properties:
      surface_pains:
        type: array
        description: "Obvious frustrations customers express directly"
        min_items: 3
        max_items: 6
      deeper_pains:
        type: array
        description: "Underlying problems driving surface frustrations"
        min_items: 2
        max_items: 4
      root_causes:
        type: array
        description: "Fundamental issues customers may not articulate"
        min_items: 1
        max_items: 3
      emotional_impact:
        type: string
        description: "How pain affects them emotionally and behaviorally"
        min_length: 50
    validation:
      - pain_hierarchy_logical: "Deeper pains should logically drive surface pains"
      - emotional_impact_specific: "Emotional impact must be specific and actionable"
      - pain_language_authentic: "Use customer's actual language and expressions"

  customer_goals:
    type: object
    properties:
      immediate_goals:
        type: array
        description: "What they want to accomplish right now"
        min_items: 2
        max_items: 5
      short_term_goals:
        type: array
        description: "3-6 month aspirations and objectives"
        min_items: 2
        max_items: 4
      long_term_goals:
        type: array
        description: "1-3 year vision and major aspirations"
        min_items: 1
        max_items: 3
      transformation_vision:
        type: string
        description: "Who they want to become or how they want to be perceived"
        min_length: 30
    validation:
      - goal_progression_logical: "Goals should build toward transformation vision"
      - goals_specific_measurable: "Goals should be specific enough to validate"
      - goal_obstacles_identified: "Include barriers preventing goal achievement"

  customer_beliefs:
    type: object
    properties:
      problem_beliefs:
        type: array
        description: "How they understand and frame their challenges"
        min_items: 2
        max_items: 4
      solution_beliefs:
        type: array
        description: "What they believe will solve their problems"
        min_items: 2
        max_items: 4
      provider_beliefs:
        type: array
        description: "What they believe about service/product providers"
        min_items: 2
        max_items: 4
      self_beliefs:
        type: array
        description: "How they see themselves and their capabilities"
        min_items: 2
        max_items: 3
    validation:
      - beliefs_consistent: "Belief systems should be internally consistent"
      - beliefs_drive_behavior: "Beliefs should explain observed behaviors"
      - belief_language_authentic: "Use their actual words and mental models"

industry_adaptations:
  b2b_saas:
    demographic_focus:
      - "Job role and responsibilities"
      - "Company size and industry"
      - "Technology stack and systems"
      - "Team structure and reporting"
    psychographic_focus:
      - "Professional identity and career aspirations"
      - "Innovation vs. stability preferences"
      - "Risk tolerance in technology adoption"
      - "Collaboration and communication styles"
    decision_psychology_focus:
      - "ROI and business impact evaluation"
      - "Integration and implementation concerns"
      - "Stakeholder approval processes"
      - "Vendor relationship preferences"

  b2b_services:
    demographic_focus:
      - "Industry expertise and specialization"
      - "Client relationship management style"
      - "Business maturity and growth stage"
      - "Professional network and referrals"
    psychographic_focus:
      - "Expertise positioning and thought leadership"
      - "Client service philosophy"
      - "Growth vs. quality balance"
      - "Professional reputation priorities"
    decision_psychology_focus:
      - "Expertise validation requirements"
      - "Relationship and trust building needs"
      - "Service delivery expectations"
      - "Long-term partnership considerations"

  b2c_product:
    demographic_focus:
      - "Household composition and roles"
      - "Lifestyle and life stage factors"
      - "Income and spending patterns"
      - "Geographic and cultural influences"
    psychographic_focus:
      - "Personal values and lifestyle priorities"
      - "Brand relationship and loyalty patterns"
      - "Social influence and peer effects"
      - "Self-expression and identity needs"
    decision_psychology_focus:
      - "Emotional vs. rational purchase drivers"
      - "Social proof and recommendation dependence"
      - "Purchase timing and seasonal factors"
      - "Brand trust and reputation requirements"

quality_validation:
  psychological_accuracy:
    - "Avatar behaviors align with stated psychology"
    - "Decision-making patterns consistent with personality profile"
    - "Communication preferences match psychographic profile"
    - "Goal-pain alignment creates logical motivation structure"

  marketing_applicability:
    - "Insights translate to specific messaging strategies"
    - "Channel preferences enable campaign optimization"
    - "Journey mapping supports conversion funnel design"
    - "Segmentation analysis enables prioritization decisions"

  implementation_readiness:
    - "Avatar guidance is specific and actionable"
    - "Team handoff documentation enables immediate application"
    - "Validation framework supports ongoing optimization"
    - "Integration guidelines ensure consistent usage"

input_requirements:
  required_variables:
    - customer_pains
    - customer_goals
    - customer_beliefs
    - avatar_name
    - company_name
    - primary_customer_segment
    - business_model_type
    
  conditional_requirements:
    business_model:
      b2b_business: ["target_company_size", "target_job_roles", "decision_authority_level"]
      b2c_business: ["consumer_market_segment", "household_decision_role", "purchase_frequency"]
    
    industry_type:
      saas: ["tech_adoption_category", "integration_preferences", "feature_priorities"]
      services: ["expertise_requirements", "relationship_preferences", "service_delivery_expectations"]
      product: ["brand_relationship_style", "purchase_decision_factors", "usage_patterns"]

  validation_rules:
    avatar_completeness:
      - "All four pain levels must be identified with specific examples"
      - "Goal hierarchy must include immediate, short-term, long-term, and transformation"
      - "Belief system must cover problem, solution, provider, and self beliefs"
      - "Decision psychology must include both rational and emotional factors"
    
    marketing_readiness:
      - "Channel preferences must be ranked with usage context"
      - "Communication style must specify tone, frequency, and format"
      - "Journey stage behavior must include specific triggers and needs"
      - "Psychological triggers must be actionable for campaign development"
    
    business_alignment:
      - "Avatar must represent significant business opportunity"
      - "Preferences must align with company capabilities and positioning"
      - "Decision process must match sales and marketing approach"
      - "Implementation requirements must be feasible for team execution"