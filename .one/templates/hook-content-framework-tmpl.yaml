  psychological_accuracy:
    - "Hook formulas based on established psychological principles"
    - "Audience triggers validated through research or testing"
    - "Emotional appeals ethically applied"
    - "Cognitive biases used responsibly"
  
  platform_alignment:
    - "Technical specifications accurate and current"
    - "Algorithm factors based on latest platform updates"
