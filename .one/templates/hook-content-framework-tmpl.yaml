template:
  id: hook-content-framework-template-v1
  name: Hook Content Framework - Elevate Marketing
  version: 1.0
  output:
    format: markdown
    filename: "docs/{{company_name}}-{{platform_name}}-hook-framework.md"
    title: "Hook Content Framework: {{platform_name}} - {{company_name}}"

workflow:
  mode: interactive
  elicitation: advanced-elicitation
  custom_elicitation:
    title: "Hook Content Optimization Actions"
    sections:
      - id: platform-psychology-deep-dive
        options:
          - "Analyze platform-specific user psychology and behavior patterns"
          - "Research viral content patterns and psychological triggers"
          - "Study audience attention patterns and scroll-stopping factors"
          - "Explore emotional triggers specific to platform culture"
          - "Investigate platform algorithm preferences and content boosting"
          - "Map user state-of-mind when consuming content on platform"
          - "Analyze competitor hook strategies and performance"
          - "Research trending formats and creative approaches"
          - "Proceed to next section"
      - id: hook-formula-development
        options:
          - "Develop curiosity gap formulas for maximum engagement"
          - "Create pattern interrupt techniques for scroll-stopping"
          - "Design emotional trigger sequences for instant connection"
          - "Build controversy and polarization hooks (ethical approach)"
          - "Craft transformation promise hooks with proof elements"
          - "Develop social proof and FOMO-based hook structures"
          - "Create problem-agitation hooks with solution tease"
          - "Design story-based hooks with cliffhanger elements"
          - "Proceed to next section"
      - id: testing-optimization-framework
        options:
          - "Design A/B testing frameworks for hook variations"
          - "Create performance tracking metrics and benchmarks"
          - "Develop iteration protocols based on performance data"
          - "Build psychological response testing methodologies"
          - "Design multivariate testing for complex hook elements"
          - "Create rapid iteration workflows for optimization"
          - "Develop performance prediction models"
          - "Build competitive benchmarking systems"
          - "Proceed to final framework"

sections:
  - id: framework-overview
    title: Hook Content Framework Overview
    instruction: |
      This framework creates platform-optimized hook content strategies based on the Elevate Framework HOOK methodology.
      Leverages Foundation Blueprint intelligence to create precision-guided attention capture that resonates with specific avatars.
      
      The framework includes:
      - Foundation intelligence integration (Avatar Pains/Goals/Beliefs, Unique Mechanism)
      - Strategic hook angle selection (Pain-Focused, Benefit-Focused, Unique/Intrigue-Focused)
      - Platform-specific user psychology mapping and optimization
      - Hook formula library with Foundation-driven variations
      - Value equation transition strategies for GIFT setup
      - A/B testing and optimization protocols
      - Performance tracking and iteration systems
      - Channel adaptation and testing methodologies
      
      Key Principle: Move beyond generic messaging to leverage deep Foundation intelligence for targeted,
      context-aware hooks designed to capture the specific attention of ideal prospects on prioritized channels.
      
      Output file location: `docs/{{company_name}}-{{platform_name}}-hook-framework.md`

  - id: foundation-blueprint-integration
    title: Foundation Blueprint Integration & Strategic Alignment
    instruction: |
      Integrate Foundation Blueprint intelligence to create precision-guided hooks.
      Use avatar insights, unique mechanism, and market intelligence for targeted attention capture.
    sections:
      - id: foundation-elements-integration
        title: Foundation Elements Integration
        template: |
          **Company Foundation Leverage:**
          - Unique Mechanism: {{unique_mechanism_preview}}
          - Unique Mechanism Differentiation: {{unique_mechanism_differentiation}}
          - Brand Voice Adjectives: {{brand_voice_adjectives}}
          - Brand Voice Application: {{brand_voice_hook_application}}
          - Value Proposition: {{value_proposition_integration}}
          - Market Differentiation: {{market_differentiation_emphasis}}
          - Market Gaps/Pains: {{market_gaps_addressing}}
          
          **Customer Avatar Intelligence (Foundation Grid):**
          - Primary Avatar: {{primary_avatar_name}}
          - Avatar Pains/Fears (A2/B2): {{avatar_pains_fears}}
          - Pain Language Patterns: {{avatar_pain_language}}
          - Avatar Goals/Dreams (A3/C3): {{avatar_goals_dreams}}
          - Aspiration Triggers: {{avatar_aspiration_triggers}}
          - Avatar Beliefs (B1): {{avatar_belief_system}}
          - Belief Challenges: {{avatar_belief_challenges}}
          - Avatar Language Patterns: {{avatar_exact_language}}
          - Underlying Needs/Feelings: {{avatar_underlying_needs}}
          
          **Market Intelligence Application:**
          - FIND Strategy Channels: {{find_strategy_channels}}
          - Awareness Stages: {{awareness_stage_mapping}}
          - Channel Context (C1/C3): {{channel_context_analysis}}
          - Platform Algorithm Factors: {{platform_algorithm_insights}}
          - User Behavior Patterns: {{user_behavior_platform_specific}}
          - Competitive Landscape: {{competitive_positioning}}
      - id: strategic-hook-angle-selection
        title: Strategic Hook Angle Selection Framework
        template: |
          **Hook Angle Selection Strategy:**
          
          **Pain-Focused Hooks (Powerful for Problem-Aware Prospects):**
          - **Formula:** [Avatar Pain Language] + [Hidden Cause/Cost] + [Unique Solution Tease]
          - **Foundation Leverage:** Avatar Pains/Fears (A2/B2), Market Gaps
          - **Platform Application:** {{pain_focused_platform_strategy}}
          - **Example Structure:** "Still {{avatar_pain_language}}? {{market_insight}} reveals why {{traditional_solution_failure}}. Here's the {{unique_mechanism_preview}} that {{success_proof}}..."
          
          **Benefit/Goal-Focused Hooks (Appeals to Aspiration):**
          - **Formula:** [Avatar Goals/Dreams] + [Unique Method] + [Proof Element]
          - **Foundation Leverage:** Avatar Goals/Dreams (A3/C3), Unique Mechanism
          - **Platform Application:** {{benefit_focused_platform_strategy}}
          - **Example Structure:** "How to {{avatar_goal}} in {{timeframe}} using {{unique_approach}} (even if {{common_objection}})"
          
          **Unique/Intrigue-Focused Hooks (Leverages Differentiation):**
          - **Formula:** [Belief Challenge] + [Authority/Proof] + [Mechanism Access]
          - **Foundation Leverage:** Unique Mechanism, Customer Beliefs (B1), Market Intelligence
          - **Platform Application:** {{intrigue_focused_platform_strategy}}
          - **Example Structure:** "What if {{common_belief}} is backwards? {{authority_research}} discovered {{counterintuitive_truth}}. The {{unique_mechanism}} behind {{impressive_result}}..."
          
          **Selected Hook Angle Justification:**
          - Primary Angle: {{selected_hook_angle}}
          - Foundation Rationale: {{hook_angle_foundation_rationale}}
          - Avatar Alignment: {{hook_angle_avatar_alignment}}
          - Platform Optimization: {{hook_angle_platform_optimization}}
      - id: value-equation-hook-transition
        title: Value Equation Hook-to-GIFT Transition Strategy
        template: |
          **Hook-to-GIFT Bridge Strategy (Elevate Framework):**
          
          **Value Equation Transition Principles:**
          - **Hook agitates pain** → **GIFT provides mini-dream outcome (DO)**
          - **Hook creates curiosity** → **GIFT satisfies with high perceived likelihood (PL)**
          - **Hook promises transformation** → **GIFT delivers with minimal time delay (TD)**
          - **Hook raises urgent question** → **GIFT answers with low effort & sacrifice (ES)**
          
          **Mechanism Preview Transition:**
          - **Hook Strategy:** {{hook_mechanism_preview_strategy}}
          - **GIFT Connection:** {{gift_mechanism_demonstration}}
          - **Value Bridge:** {{hook_gift_value_bridge}}
          - **Natural Progression:** {{hook_gift_natural_progression}}
          
          **Psychological CTA Integration:**
          
          **Curiosity-Driven CTAs:**
          - "Discover the {{mechanism_element}} behind {{result_preview}} →"
          - "See the exact {{method_preview}} that {{outcome_tease}} →"
          - "Get the {{unique_tool}} {{authority_figure}} uses →"
          - "Access the {{secret_strategy}} inside →"
          
          **Value-Focused CTAs:**
          - "Get your free {{specific_outcome}} {{tool_guide}} →"
          - "Download the {{problem_solving}} blueprint →"
          - "Claim your {{result_oriented}} toolkit →"
          - "Start your {{transformation}} with this free {{asset}} →"
          
          **Selected Transition Strategy:**
          {{selected_transition_strategy}}

