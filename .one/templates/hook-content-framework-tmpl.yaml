# Advanced template configuration
variables:
  platform_specs:
    type: object
    properties:
      platform_name:
        type: string
        description: "Name of the platform (TikTok, Instagram, Facebook, YouTube, LinkedIn, Google Ads)"
        required: true
      platform_type:
        type: string
        enum: ["social_media", "paid_advertising", "video_platform", "professional_network"]
        description: "Category of platform for conditional content"
      user_demographics:
        type: object
        description: "Platform-specific user demographics and behaviors"
      algorithm_factors:
        type: array
        description: "Key algorithm optimization factors for the platform"
      content_formats:
        type: array
        description: "Available content formats and specifications"
    validation:
      - platform_analysis_comprehensive: "Platform analysis must include user psychology and behavior patterns"
      - algorithm_understanding_current: "Algorithm factors must be based on current platform mechanics"
      - format_specifications_accurate: "Technical specifications must be accurate and up-to-date"

  audience_triggers:
    type: object
    properties:
      emotional_triggers:
        type: array
        description: "Primary emotional triggers that drive audience action"
        min_items: 3
        max_items: 7
      cognitive_biases:
        type: array
        description: "Cognitive biases to leverage in hook creation"
        min_items: 3
        max_items: 5
      social_drivers:
        type: array
        description: "Social psychology factors that influence sharing and engagement"
        min_items: 2
        max_items: 4
      platform_behaviors:
        type: object
        description: "Platform-specific behavioral patterns and preferences"
    validation:
      - triggers_evidence_based: "All triggers must be based on psychological research or data"
      - platform_alignment: "Triggers must align with platform user behavior"
      - ethical_consideration: "Triggers must be ethically applied without manipulation"

  viral_elements:
    type: object
    properties:
      share_mechanics:
        type: array
        description: "Elements that drive sharing behavior"
        min_items: 3
      viral_loops:
        type: array
        description: "Self-reinforcing viral mechanics"
        min_items: 2
      trend_patterns:
        type: array
        description: "Platform-specific viral trend patterns"
      amplification_factors:
        type: object
        description: "Factors that amplify content reach"
    validation:
      - viral_authenticity: "Viral elements must feel authentic to platform culture"
      - sustainable_virality: "Viral mechanics should be sustainable, not one-time gimmicks"
      - brand_alignment: "Viral elements must align with brand values and messaging"

hook_formula_categories:
  curiosity_gap:
    psychological_basis: "Leverages information gap theory and cognitive closure need"
    subtypes:
      - knowledge_gap: "Reveals partial information to create knowledge seeking behavior"
      - story_gap: "Starts narrative without resolution to drive completion desire"
      - mystery_gap: "Presents puzzle or unexplained phenomenon"
    effectiveness: "High engagement, particularly for educational and entertainment content"
  
  emotional_trigger:
    psychological_basis: "Activates limbic system for immediate emotional response"
    subtypes:
      - fear_loss: "Triggers loss aversion and protective instincts"
      - aspiration_gain: "Activates achievement motivation and future-self visualization"
      - empathy_connection: "Creates emotional resonance through shared experience"
    effectiveness: "Strong for conversion but requires ethical application"
  
  social_proof:
    psychological_basis: "Leverages conformity bias and social validation needs"
    subtypes:
      - authority_proof: "Expert or celebrity endorsement"
      - peer_proof: "Similar people success stories"
      - wisdom_crowds: "Large numbers as validation"
    effectiveness: "Builds trust and reduces decision friction"
  
  pattern_interrupt:
    psychological_basis: "Disrupts automatic processing to capture conscious attention"
    subtypes:
      - visual_interrupt: "Unexpected imagery or motion"
      - cognitive_interrupt: "Logic defying or surprising information"
      - sensory_interrupt: "Unusual sounds or visual effects"
    effectiveness: "Excellent for scroll-stopping but must deliver value post-interrupt"

testing_framework_components:
  test_design:
    hypothesis_formation: "Clear hypothesis with expected outcome"
    variable_isolation: "Test one primary variable at a time"
    sample_calculation: "Statistically significant sample sizes"
    duration_planning: "Adequate time for reliable results"
  
  metrics_framework:
    leading_indicators:
      - view_rate: "Initial hook effectiveness"
      - engagement_rate: "Content quality signal"
      - completion_rate: "Full message delivery"
    lagging_indicators:
      - conversion_rate: "Business impact"
      - cost_efficiency: "ROI optimization"
      - brand_metrics: "Long-term brand health"
  
  iteration_protocol:
    analysis_frequency: "Daily, weekly, monthly review cycles"
    decision_framework: "Clear criteria for winner selection"
    learning_documentation: "Systematic insight capture"
    scaling_triggers: "Performance thresholds for scaling"

platform_optimization_priorities:
  tiktok:
    priority_elements:
      - "First 3 seconds hook critical"
      - "Sound selection and trends"
      - "Native creator style"
      - "Loop-worthy content"
    algorithm_optimization:
      - "Completion rate focus"
      - "Share and save signals"
      - "Comment engagement"
  
  instagram:
    priority_elements:
      - "Visual aesthetic quality"
      - "Multi-format strategy"
      - "Story-to-feed funnel"
      - "Hashtag optimization"
    algorithm_optimization:
      - "Engagement velocity"
      - "Relationship signals"
      - "Time spent metrics"
  
  youtube:
    priority_elements:
      - "Thumbnail-title synergy"
      - "First 15 seconds retention"
      - "Chapter optimization"
      - "End screen strategy"
    algorithm_optimization:
      - "Watch time maximization"
      - "Session duration"
      - "Click-through rate"
  
  linkedin:
