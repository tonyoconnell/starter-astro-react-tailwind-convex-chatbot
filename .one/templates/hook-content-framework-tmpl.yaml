  - id: hook-formula-library
    title: Hook Formula Library & Templates
    instruction: |
      Create comprehensive hook formula library with platform-specific variations.
      Each formula should include psychological basis, structure, and examples.
    sections:
      - id: curiosity-gap-formulas
        title: Curiosity Gap Hook Formulas
        sections:
          - id: foundation-leveraged-problem-hook
            title: Foundation-Leveraged Problem Hook
            template: |
              **Formula Structure:** [Avatar Pain Language] + [Hidden/Underlying Cause] + [Unique Solution Tease]
              
              **Foundation Integration:** Avatar Pains + Market Intelligence + Unique Mechanism
              
              **Psychological Basis:** Agitates specific customer pain using their exact language while introducing unique solution approach
              
              **Formula Application:**
              ```
              "Still [Avatar Pain in their words]?
              [Market insight/data] reveals why [traditional solutions fail].
              Here's the [Unique Mechanism preview] that [Success proof]..."
              ```
              
              **Platform Variations:**
              
              **Social Media Version:**
              "{{foundation_problem_social_example}}"
              - Visual: {{problem_hook_visual_strategy}}
              - Text Overlay: {{problem_hook_text_overlay}}
              - Call-to-Action: {{problem_hook_social_cta}}
              
              **Paid Ad Version:**
              "{{foundation_problem_paid_example}}"
              - Headline: {{problem_hook_paid_headline}}
              - Description: {{problem_hook_paid_description}}
              - Unique Mechanism Hint: {{problem_hook_mechanism_hint}}
              
              **Advanced Example:** "Still losing leads at checkout? Shopify data shows 69% abandon due to 'trust gaps' most stores ignore. Here's the 3-layer trust architecture that added $2.3M to client stores..."
              
              **Testing Variables:**
              - Pain Specificity: {{pain_specificity_variations}}
              - Market Data Authority: {{market_data_variations}}
              - Mechanism Preview Depth: {{mechanism_preview_variations}}
          - id: strategic-curiosity-gap-hook
            title: Strategic Curiosity Gap Hook
            template: |
              **Formula Structure:** [Belief Challenge] + [Authority Validation] + [Exclusive Mechanism Access]
              
              **Foundation Integration:** Unique Mechanism + Customer Beliefs + Authority
              
              **Psychological Basis:** Challenges conventional wisdom while providing authoritative validation and exclusive access
              
              **Formula Application:**
              ```
              "What if [Common Belief] is backwards?
              [Authority/Research] discovered [Counterintuitive Truth].
              The [Unique Mechanism] behind [Impressive Result]..."
              ```
              
              **Advanced Example:** "What if 'more traffic' is killing your sales? MIT research found high-traffic stores convert 67% worse. The 'Precision Funnel' method that turns fewer visitors into more customers..."
              
              **Platform Applications:**
              - Social Media: {{curiosity_gap_social_approach}}
              - Paid Ads: {{curiosity_gap_paid_approach}}
              - Email: {{curiosity_gap_email_approach}}
              
              **Authority Sources:**
              - Research Studies: {{research_authority_integration}}
              - Expert Insights: {{expert_authority_positioning}}
              - Data Analysis: {{data_authority_presentation}}
          - id: authority-mechanism-hook
            title: Authority-Mechanism Hook
            template: |
              **Formula Structure:** [Authority Positioning] + [Unique Insight] + [Mechanism Preview] + [Results Proof]
              
              **Foundation Integration:** Brand Voice + Unique Mechanism + Social Proof
              
              **Formula Application:**
              ```
              "After [Credential/Experience], I discovered [Unique Insight].
              The [Mechanism Name] that [Specific Result] for [Target Audience].
              [Proof Element] inside..."
              ```
              
              **Advanced Example:** "After helping 247 SaaS companies scale, I discovered why 'growth hacking' fails. The 'Compound Growth Engine' that 3x'd revenue for 89% of clients. Blueprint inside..."
              
              **Authority Building Elements:**
              - Credibility Establishment: {{authority_credibility_strategy}}
              - Unique Insight Presentation: {{unique_insight_delivery}}
              - Mechanism Naming: {{mechanism_naming_strategy}}
              - Proof Integration: {{authority_proof_strategy}}
          - id: transformation-bridge-hook
            title: Transformation Bridge Hook
            template: |
              **Formula Structure:** [Current State] → [Unique Method] → [Desired State] + [Social Proof]
              
              **Foundation Integration:** Avatar Goals + Unique Mechanism + Proof
              
              **Formula Application:**
              ```
              "From [Current Frustrating State] to [Desired Outcome] using [Unique Method].
              [Number] [Target Audience] already achieved [Specific Result].
              See the exact [Mechanism] inside..."
              ```
              
              **Advanced Example:** "From feast-or-famine freelancing to predictable $15K months using the 'Client Magnet System.' 1,247 freelancers landed premium clients in 90 days. See the exact 5-step system inside..."
              
              **Transformation Elements:**
              - Current State Agitation: {{current_state_pain_amplification}}
              - Bridge Method: {{transformation_method_preview}}
              - Desired State Visualization: {{desired_outcome_painting}}
              - Social Proof Integration: {{transformation_social_proof}}
          - id: knowledge-gap-hooks
            title: Knowledge Gap Hooks
            template: |
              **Formula Structure:** [Surprising Fact] + [Knowledge Tease] + [Benefit Promise]
              
