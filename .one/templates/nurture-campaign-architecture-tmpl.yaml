# Advanced template configuration and validation
variables:
  campaign_duration:
    type: string
    description: "Duration of the nurture campaign (e.g., '90 days', '6 months', 'ongoing')"
    required: true
    validation:
      - realistic_timeline: "Campaign duration must be realistic for relationship building"
      - sufficient_touchpoints: "Duration must allow for adequate relationship development"

  content_themes:
    type: array
    description: "Primary content themes for educational progression"
    min_items: 3
    max_items: 8
    items:
      type: object
      properties:
        theme_name:
          type: string
          min_length: 5
        theme_purpose:
          type: string
          min_length: 20
        progression_level:
          type: string
          enum: ["foundation", "development", "advanced", "mastery"]
    validation:
      - theme_progression: "Themes must build upon each other logically"
      - value_focused: "Each theme must deliver clear value to prospects"
      - expertise_building: "Themes should establish authority and expertise"

  conversion_triggers:
    type: array
    description: "Behavioral and contextual triggers that indicate conversion readiness"
    min_items: 5
    max_items: 15
    items:
      type: object
      properties:
        trigger_name:
          type: string
          min_length: 5
        trigger_category:
          type: string
          enum: ["behavioral", "temporal", "contextual", "engagement", "external"]
        conversion_probability:
          type: number
          min: 1
          max: 10
        relationship_impact:
          type: string
          enum: ["positive", "neutral", "risk"]
    validation:
      - trigger_completeness: "All triggers must have clear detection criteria"
      - relationship_preservation: "Triggers must consider relationship preservation"
      - scoring_logic: "Trigger scoring must be logical and data-driven"

relationship_building_framework:
  trust_development:
    stages: ["awareness", "credibility", "reliability", "intimacy", "advocacy"]
    tactics: ["transparency", "consistency", "expertise", "value_delivery", "reciprocity"]
    measurement: ["engagement_depth", "response_quality", "initiative_taking", "referral_behavior"]
  
  value_delivery:
    types: ["educational", "strategic", "tactical", "transformational"]
    progression: ["immediate", "short_term", "medium_term", "long_term"]
    measurement: ["value_recognition", "implementation_rate", "outcome_achievement", "satisfaction"]
  
  emotional_connection:
    elements: ["shared_values", "personal_stories", "community", "recognition"]
    development: ["empathy", "understanding", "connection", "loyalty"]
    measurement: ["emotional_response", "engagement_quality", "advocacy_behavior", "retention"]

conversion_strategy_framework:
  pathway_types:
    education_based:
      characteristics: ["knowledge_building", "expertise_demonstration", "trust_development"]
      triggers: ["information_seeking", "learning_engagement", "expertise_recognition"]
      timeline: "extended"
    
    problem_solution:
      characteristics: ["pain_point_identification", "solution_positioning", "fit_demonstration"]
      triggers: ["problem_expression", "solution_research", "fit_confirmation"]
      timeline: "moderate"
    
    social_proof:
      characteristics: ["peer_validation", "authority_endorsement", "success_stories"]
      triggers: ["peer_seeking", "validation_requests", "success_interest"]
      timeline: "accelerated"
    
    timing_based:
      characteristics: ["opportunity_windows", "urgency_creation", "decision_catalysts"]
      triggers: ["timing_signals", "urgency_indicators", "decision_pressure"]
      timeline: "immediate"

content_progression_model:
  foundation_level:
    focus: ["problem_awareness", "solution_introduction", "value_demonstration"]
    formats: ["educational_content", "introductory_guides", "foundation_resources"]
    outcomes: ["awareness", "interest", "initial_trust"]
  
  development_level:
    focus: ["deeper_education", "methodology_sharing", "capability_building"]
    formats: ["detailed_guides", "case_studies", "best_practices"]
    outcomes: ["understanding", "capability", "confidence"]
  
  advanced_level:
    focus: ["strategic_insights", "advanced_strategies", "thought_leadership"]
    formats: ["strategic_content", "industry_analysis", "innovation_insights"]
    outcomes: ["expertise_recognition", "strategic_alignment", "partnership_potential"]
  
  mastery_level:
    focus: ["cutting_edge_insights", "future_trends", "transformation_guidance"]
    formats: ["exclusive_content", "preview_access", "collaborative_insights"]
    outcomes: ["mastery_recognition", "advisory_relationship", "advocacy"]

channel_optimization_framework:
  email_optimization:
    elements: ["subject_lines", "content_structure", "personalization", "timing"]
    best_practices: ["value_first", "relationship_focus", "consistency", "authenticity"]
    measurement: ["open_rates", "engagement_rates", "relationship_depth", "conversion_quality"]
  
  multi_channel_coordination:
    elements: ["message_consistency", "channel_strengths", "context_preservation", "handoff_protocols"]
    best_practices: ["unified_experience", "channel_optimization", "preference_respect", "seamless_transition"]
    measurement: ["cross_channel_engagement", "journey_completion", "experience_quality", "preference_alignment"]

quality_validation_framework:
  relationship_focus:
    - sustainable_engagement: "Engagement strategies must be sustainable long-term"
    - trust_building: "All activities must contribute to trust development"
    - value_delivery: "Consistent value delivery must be maintained"
    - relationship_preservation: "Conversion activities must preserve relationships"
  
  conversion_effectiveness:
    - trigger_accuracy: "Conversion triggers must be accurately identified"
    - pathway_optimization: "Multiple conversion pathways must be optimized"
    - timing_optimization: "Conversion timing must respect relationship readiness"
    - quality_maintenance: "Conversion quality must be prioritized over quantity"
  
  implementation_readiness:
    - resource_planning: "Implementation must be properly resourced"
    - team_readiness: "Team must be trained on relationship-focused approach"
    - technology_readiness: "Technology must support relationship building"
    - measurement_readiness: "Metrics must track both relationships and conversions"

conditional_logic:
  campaign_type:
    email_primary:
      focus_areas: ["subject_optimization", "content_depth", "sequence_design", "personalization"]
      constraints: ["frequency_limits", "content_length", "deliverability", "engagement_maintenance"]
    
    multi_channel:
      focus_areas: ["channel_coordination", "message_consistency", "experience_continuity", "preference_respect"]
      constraints: ["complexity_management", "resource_requirements", "coordination_challenges", "attribution_complexity"]
  
  industry_type:
    b2b:
      considerations: ["longer_cycles", "multiple_stakeholders", "educational_focus", "authority_building"]
      optimization: ["thought_leadership", "expertise_demonstration", "relationship_depth", "trust_development"]
    
    b2c:
      considerations: ["emotional_triggers", "lifestyle_alignment", "social_proof", "convenience"]
      optimization: ["emotional_connection", "lifestyle_integration", "community_building", "experience_quality"]

integration_requirements:
