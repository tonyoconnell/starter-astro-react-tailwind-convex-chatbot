  - id: conditional-campaign-approaches
    title: Email vs Multi-Channel Nurture Approaches
    instruction: |
      Define conditional approaches based on channel strategy with LLM optimization for each channel type.
      Create comprehensive strategies for both email-focused and multi-channel campaigns.
    sections:
      - id: email-focused-approach
        title: Email-Focused Nurture Campaign
        conditional:
          email_primary:
            template: |
              **Email-Centric Nurture Strategy:**
              
              **Email Optimization Framework:**
              - Send Frequency: {{email_send_frequency}}
              - Optimal Send Times: {{email_optimal_timing}}
              - Subject Line Strategy: {{email_subject_strategy}}
              - Content Length Optimization: {{email_content_length}}
              
              **Email Sequence Architecture (Elevate Nurture Framework + IBB):**
              
              **Sequence Types Available (Chapter 14 Framework):**
              - Post-Gift Value Sequence: Follow up initial Gift with more related tips/insights
              - Problem/Solution Sequence: Deep dive into core problem, explore failed solutions, introduce unique approach
              - Story/Rapport Building Sequence: Share relatable customer journeys, brand origin, behind-the-scenes
              - Pre-Offer/Launch Sequence: Build anticipation and desire before presenting core offer explicitly
              - Abandoned Cart Sequence: Specific urgent sequence for potential lost sales recovery
              
              **Welcome Series (Emails 1-3) - Value-First IBB Approach**
              - Email 1: {{welcome_email_1_focus}} (Gift delivery + additional value, no selling) - Send: {{welcome_1_timing}}
              - Email 2: {{welcome_email_2_focus}} (Related tips/insights, continue value delivery) - Send: {{welcome_2_timing}}
              - Email 3: {{welcome_email_3_focus}} (Problem/solution education, authority building) - Send: {{welcome_3_timing}}
              
              **Educational Series (Emails 4-12) - Authority Building**
              - Educational Theme 1: {{educational_theme_1}} (Deep problem exploration) - Emails: {{theme_1_email_count}}
              - Educational Theme 2: {{educational_theme_2}} (Solution methodology) - Emails: {{theme_2_email_count}}
              - Educational Theme 3: {{educational_theme_3}} (Unique mechanism introduction) - Emails: {{theme_3_email_count}}
              
              **Social Proof Series (Emails 13-18)**
              - Customer Success Focus: {{customer_success_email_strategy}}
              - Case Study Integration: {{case_study_email_approach}}
              - Testimonial Strategy: {{testimonial_email_strategy}}
              
              **Conversion Series (Emails 19-24) - Relationship-Respectful Conversion (IBB)**
              - Soft Conversion Approach: {{soft_conversion_email_strategy}} (Pre-frame offer as logical solution)
              - Direct Conversion Strategy: {{direct_conversion_email_approach}} (Value equation emphasis, Hormozi framework)
              - Objection Handling: {{objection_handling_email_strategy}} (Address common misconceptions through education)
              - Abandoned Cart Recovery: {{abandoned_cart_email_strategy}} (Specific urgent sequence for cart abandoners)
              - Trust Reinforcement: Strong guarantee and risk reversal messaging (impossible to miss)
              - Relationship Preservation: Maintain helpful, non-aggressive tone throughout conversion attempts
              
              **Email Personalization Strategy:**
              {{email_personalization_framework}}
              
              **Email Performance Optimization:**
              {{email_performance_optimization}}
      - id: multi-channel-approach
        title: Multi-Channel Nurture Campaign
