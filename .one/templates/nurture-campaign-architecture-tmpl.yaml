template:
  id: nurture-campaign-architecture-template-v1
  name: Nurture Campaign Architecture - Elevate Marketing
  version: 1.0
  output:
    format: markdown
    filename: "docs/{{company_name}}-{{campaign_type}}-nurture-architecture.md"
    title: "{{campaign_type}} Nurture Campaign Architecture - {{company_name}}"

workflow:
  mode: interactive
  elicitation: advanced-elicitation
  llm_assistance:
    real_time_guidance: true
    decision_support: true
    optimization_suggestions: true
    relationship_building_focus: true
    long_term_conversion_strategy: true
  custom_elicitation:
    title: "Nurture Campaign Architecture Development Actions"
    sections:
      - id: relationship-strategy-development
        options:
          - "Analyze relationship building using Intent-Based Branding (IBB) and value-first approaches"
          - "Map trust-building touchpoints using Elevate Framework relationship marketing principles"
          - "Design progressive value reveal strategies for sustained engagement without aggressive selling"
          - "Research emotional connection patterns using storytelling and empathy-driven content"
          - "Study customer success indicators and celebrate transformation milestones"
          - "Explore educational content sequencing for authority building and expertise positioning"
          - "Analyze timing patterns for relationship-respectful conversion optimization"
          - "Design reciprocity and social proof integration using customer success stories"
          - "Proceed to next section"
      - id: conversion-strategy-architecture
        options:
          - "Map long-term conversion pathways with multiple touchpoints"
          - "Design conversion trigger identification and activation systems"
          - "Analyze customer readiness indicators and engagement scoring"
          - "Research conversion barrier removal and objection handling"
          - "Study social proof and authority building sequences"
          - "Explore urgency creation without relationship damage"
          - "Design conversion opportunity recognition and capture"
          - "Map conversion attribution across extended nurture cycles"
          - "Proceed to next section"
      - id: content-strategy-framework
        options:
          - "Design content progression from awareness to advocacy"
          - "Map educational content sequencing for expertise building"
          - "Create value-first content strategies with subtle promotion"
          - "Develop storytelling frameworks for emotional connection"
          - "Design social proof integration and customer success stories"
          - "Explore interactive content for engagement amplification"
          - "Create content personalization and dynamic adaptation"
          - "Design content performance tracking and optimization"
          - "Proceed to next section"
      - id: multi-channel-orchestration
        options:
          - "Design seamless multi-channel nurture experiences"
          - "Map channel-specific strengths for relationship building"
          - "Create cross-channel conversation continuity systems"
          - "Develop channel coordination for consistent messaging"
          - "Design channel-specific content optimization strategies"
          - "Explore omnichannel customer journey orchestration"
          - "Create channel performance attribution and optimization"
          - "Design channel escalation and handoff protocols"
          - "Proceed to campaign architecture completion"

sections:
  - id: campaign-overview
    title: Nurture Campaign Architecture Overview
    instruction: |
      This nurture campaign architecture creates comprehensive long-term relationship building and conversion systems.
      Focus on sustainable engagement, trust development, and gradual conversion optimization.
      
      The architecture includes:
      - Relationship building frameworks with progressive value delivery
      - Long-term conversion strategies with multiple engagement pathways
      - Content sequencing for education, trust, and authority building
      - Multi-channel orchestration for consistent experience delivery
      - Performance tracking for relationship and conversion optimization
      - Segmentation strategies for personalized nurture experiences
      
      Output file location: `docs/{{company_name}}-{{campaign_type}}-nurture-architecture.md`

  - id: relationship-building-framework
    title: Relationship Building & Trust Development Framework
    instruction: |
      Design comprehensive relationship building strategies with LLM assistance for emotional intelligence.
      Focus on long-term trust development, value delivery, and loyalty creation.
    variables:
      - campaign_duration
      - content_themes
      - relationship_goals
    sections:
      - id: relationship-strategy
        title: Relationship Development Strategy
        template: |
          **Nurture Campaign Type:** {{campaign_type}}
          **Primary Relationship Objective:** {{primary_relationship_objective}}
          **Campaign Duration:** {{campaign_duration}}
          
          **Relationship Building Philosophy:**
          {{relationship_building_philosophy}}
          
          **Trust Development Framework (Elevate Nurture Principles - IBB Integration):**
          
          **Intent-Based Branding (IBB) Core Tenets:**
          - Lead with Value Consistently: Provide valuable insights before any selling attempt
          - Build Trust & Authority: Position as credible, helpful expert through demonstration
          - Stay Top-of-Mind: Regular valuable content keeps brand present when timing is right
          - Segment for Relevance: Tailor communication based on initial interest/behavior
          - Shift Beliefs & Overcome Objections: Address misconceptions through nurture content
          
          **Stage 1: Awareness & Introduction ({{stage_1_duration}})**
          - Primary Goal: {{stage_1_primary_goal}} (Lead with value, not pitch - IBB principle)
          - Trust Elements: {{stage_1_trust_elements}} (Transparency, helpful content, no aggressive selling)
          - Value Delivery: {{stage_1_value_delivery}} (Educational insights, problem solutions, further tips)
          - Engagement Strategy: {{stage_1_engagement_strategy}} (Build authority through expertise, deliver more value)
          - IBB Implementation: Continue providing value related to initial Gift, no direct pitching
          - Success Metrics: {{stage_1_success_metrics}} (Engagement rate, content consumption, value recognition)
          
          **Stage 2: Education & Authority Building ({{stage_2_duration}})**
          - Primary Goal: {{stage_2_primary_goal}} (Deep dive into core problem, explore failed solutions)
          - Trust Elements: {{stage_2_trust_elements}} (Expertise demonstration, unique insights)
          - Value Delivery: {{stage_2_value_delivery}} (Problem/solution education, methodology sharing)
          - Engagement Strategy: {{stage_2_engagement_strategy}} (Thought leadership, case studies)
          - IBB Implementation: Share relatable customer journeys, behind-the-scenes content
          - Success Metrics: {{stage_2_success_metrics}} (Content depth engagement, authority recognition)
          
          **Stage 3: Consideration & Relationship Deepening ({{stage_3_duration}})**
          - Primary Goal: {{stage_3_primary_goal}}
          - Trust Elements: {{stage_3_trust_elements}}
          - Value Delivery: {{stage_3_value_delivery}}
          - Engagement Strategy: {{stage_3_engagement_strategy}}
          - Success Metrics: {{stage_3_success_metrics}}
          
          **Stage 4: Decision Support & Conversion ({{stage_4_duration}})**
          - Primary Goal: {{stage_4_primary_goal}} (Pre-frame offer as logical solution, build anticipation)
          - Trust Elements: {{stage_4_trust_elements}} (Strong guarantees, risk reversal, social proof)
          - Value Delivery: {{stage_4_value_delivery}} (Decision support, outcome visualization)
          - Engagement Strategy: {{stage_4_engagement_strategy}} (Gentle conversion approach, value emphasis)
          - IBB Implementation: Present core offer as natural next step, respect relationship built
          - Success Metrics: {{stage_4_success_metrics}} (Conversion rate, relationship preservation score)
          
          **Stage 5: Advocacy & Long-term Relationship ({{stage_5_duration}})**
          - Primary Goal: {{stage_5_primary_goal}}
          - Trust Elements: {{stage_5_trust_elements}}
          - Value Delivery: {{stage_5_value_delivery}}
          - Engagement Strategy: {{stage_5_engagement_strategy}}
          - Success Metrics: {{stage_5_success_metrics}}
      - id: value-delivery-architecture
        title: Progressive Value Delivery Architecture
        template: |
          **Value Delivery Philosophy (Elevate Framework IBB):**
          {{value_delivery_philosophy}}
          
          **Core IBB Principles:**
          - Lead with value consistently before selling
          - Build trust and authority through expertise demonstration
          - Address underlying objections through educational content
          - Stay top-of-mind through regular valuable insights
          - Shift beliefs and overcome misconceptions gradually
          
          **Value Ladder Design:**
          
          **Foundation Value (Immediate)**
          - Value Type: {{foundation_value_type}}
          - Delivery Method: {{foundation_delivery_method}}
          - Engagement Trigger: {{foundation_trigger}}
          - Expected Impact: {{foundation_impact}}
          - Measurement: {{foundation_measurement}}
          
          **Educational Value (Short-term)**
          - Value Type: {{educational_value_type}}
          - Delivery Method: {{educational_delivery_method}}
          - Engagement Trigger: {{educational_trigger}}
          - Expected Impact: {{educational_impact}}
          - Measurement: {{educational_measurement}}
          
          **Strategic Value (Medium-term)**
          - Value Type: {{strategic_value_type}}
          - Delivery Method: {{strategic_delivery_method}}
          - Engagement Trigger: {{strategic_trigger}}
          - Expected Impact: {{strategic_impact}}
          - Measurement: {{strategic_measurement}}
          
          **Transformational Value (Long-term)**
          - Value Type: {{transformational_value_type}}
          - Delivery Method: {{transformational_delivery_method}}
          - Engagement Trigger: {{transformational_trigger}}
          - Expected Impact: {{transformational_impact}}
          - Measurement: {{transformational_measurement}}
          
          **Value Reinforcement System:**
          {{value_reinforcement_framework}}
      - id: emotional-connection-framework
        title: Emotional Connection & Loyalty Framework
        template: |
          **Emotional Engagement Strategy:**
          
          **Emotional Journey Mapping:**
          - Initial Emotion: {{initial_emotional_state}}
          - Desired Emotion: {{target_emotional_state}}
          - Emotional Milestones: {{emotional_progression_milestones}}
          - Connection Deepening Strategy: {{connection_deepening_approach}}
          
          **Emotional Triggers & Responses:**
          
          **Trust Building Triggers:**
          - Transparency Moments: {{transparency_trigger_moments}}
          - Vulnerability Sharing: {{vulnerability_sharing_strategy}}
          - Consistency Demonstration: {{consistency_demonstration}}
          - Expertise Validation: {{expertise_validation_approach}}
          
          **Connection Amplification:**
          - Personal Story Integration: {{personal_story_strategy}}
          - Shared Values Emphasis: {{shared_values_approach}}
          - Community Building: {{community_building_strategy}}
          - Recognition & Appreciation: {{recognition_framework}}
          
          **Loyalty Development System:**
          - Exclusive Access: {{exclusive_access_strategy}}
          - Insider Information: {{insider_information_approach}}
