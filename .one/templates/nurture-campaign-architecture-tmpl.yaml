    behavioral_data: ["engagement_history", "content_consumption", "interaction_patterns", "preference_signals"]
    relationship_data: ["trust_indicators", "engagement_quality", "response_patterns", "advocacy_behaviors"]
    conversion_data: ["trigger_events", "pathway_progression", "conversion_readiness", "outcome_tracking"]
  
