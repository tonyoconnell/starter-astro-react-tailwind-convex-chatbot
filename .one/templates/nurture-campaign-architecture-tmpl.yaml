  - id: segmentation-personalization
    title: Advanced Segmentation & Personalization
    instruction: |
      Create sophisticated segmentation and personalization strategies with LLM assistance for maximum relevance.
      Focus on behavioral, psychographic, and lifecycle-based segmentation.
    sections:
      - id: segmentation-framework
        title: Advanced Segmentation Strategy
        template: |
          **Segmentation Philosophy (Elevate Framework Integration):**
          {{segmentation_philosophy}}
          
          **Elevate-Based Segmentation Criteria (Enhanced with Prompts Framework):**
          - Gift/Lead Magnet Source: Segment by initial value delivered (checklist downloaders vs webinar attendees)
          - Engagement Level: Based on content consumption and interaction quality (email opens, link clicks, time spent)
          - Conversion Readiness: Using behavioral signals and engagement patterns (pricing page views, demo requests)
          - Problem Awareness: Depth of understanding of core challenges (beginner vs advanced content consumption)
          - Solution Stage: Awareness, consideration, or decision phase positioning (research vs comparison behavior)
          - Industry/Role Specificity: Segment by professional context for maximum relevance
          - Communication Preference: Segment by preferred content format and engagement style
          
          **Primary Segmentation Dimensions:**
          
          **Demographic Segmentation:**
          - Industry: {{industry_segmentation_approach}}
          - Company Size: {{company_size_segmentation}}
          - Role/Function: {{role_function_segmentation}}
          - Geographic: {{geographic_segmentation}}
          
          **Behavioral Segmentation:**
          - Engagement Level: {{engagement_level_segmentation}}
          - Content Preferences: {{content_preference_segmentation}}
          - Purchase History: {{purchase_history_segmentation}}
          - Usage Patterns: {{usage_pattern_segmentation}}
          
          **Psychographic Segmentation:**
          - Value Orientation: {{value_orientation_segmentation}}
