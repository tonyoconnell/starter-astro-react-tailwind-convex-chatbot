# Repository Template Architecture for NPX OneIE Universal Access
# Task 2.1.2: Complete Implementation Specification
# Engineering Developer: Jordan - Implementation and Code Execution Patterns

template:
  id: repository-template-architecture
  name: "ONE Framework Universal Repository Template"
  description: "Complete production-ready template architecture enabling universal `npx oneie` access"
  version: "1.0.0"
  task: "2.1.2"
  builder: "Engineering Developer (Jordan)"
  coordinator: "Engineering Architect"
  
  quality_gate:
    target: "4.0+ stars"
    validation: "Trinity architecture integration validated"
    success_criteria: "Repository template architecture documented"

# CORE ARCHITECTURE PRINCIPLES
architecture:
  pattern: "turbo_monorepo_trinity"
  philosophy: "myspace_with_ai"
  access_model: "npx_oneie_universal"
  
  trinity_layers:
    execution: ".claude/"     # 112+ AI agents + commands + hooks
    foundation: ".one/"       # Platform resources + workflows + templates  
    creation: "one/"          # User workspace + missions + stories
    
  technology_stack:
    monorepo: "turbo + bun"
    frontend: "next.js 15 + react 19 + typescript"
    backend: "convex (real-time collaboration)"
    ui: "shadcn/ui + tailwind css + radix ui"
    desktop: "tauri (rust + webview)"
    mobile: "react native + expo"
    cli: "node.js + commander.js + chalk"
    testing: "vitest + react testing library + playwright"
    deployment: ["vercel", "cloudflare-pages", "tauri", "app-stores"]

# REPOSITORY STRUCTURE SPECIFICATION
structure:
  root_configuration:
    files:
      - name: "package.json"
        template: "root-package-turbo"
        purpose: "Turbo monorepo root configuration"
        includes: ["workspaces", "scripts", "devDependencies"]
        
      - name: "turbo.json"
        template: "turbo-pipeline-config"
        purpose: "Turbo pipeline configuration"
        includes: ["build", "dev", "test", "lint", "deploy"]
        
      - name: "bun.lockb"
        generated: true
        purpose: "Bun package manager lockfile"
        
      - name: ".gitignore"
        template: "turbo-monorepo-gitignore"
        purpose: "Comprehensive gitignore for turbo monorepo"
        
      - name: "README.md"
        template: "oneie-universal-readme"
        purpose: "Complete setup and usage documentation"
        
      - name: "tsconfig.json"
        template: "turbo-typescript-config"
        purpose: "Root TypeScript configuration"
        
      - name: ".eslintrc.json"
        template: "turbo-eslint-config"
        purpose: "ESLint configuration for monorepo"

  # APPLICATIONS DIRECTORY
  apps_directory:
    path: "apps/"
    description: "Application packages - user-facing applications"
    
    web:
      framework: "next.js 15"
      description: "Primary web application with React 19"
      package_name: "@apps/web"
      dependencies: ["@packages/one", "@packages/ui", "@packages/types", "@packages/utils"]
      deployment: ["vercel", "cloudflare-pages"]
      structure:
        - "src/"
        - "pages/"
        - "components/"
        - "public/"
        - "package.json"
        - "next.config.js"
        - "tailwind.config.js"
        
    api:
      framework: "convex"
      description: "Backend services with real-time collaboration"
      package_name: "@apps/api"
      dependencies: ["convex", "@packages/types"]
      deployment: ["convex-cloud"]
      structure:
        - "convex/"
        - "schema.ts"
        - "package.json"
        - "convex.config.ts"
        
    desktop:
      framework: "tauri"
      description: "Cross-platform desktop application"
      package_name: "@apps/desktop"
      dependencies: ["@tauri-apps/api", "@packages/ui", "@packages/utils"]
      platforms: ["windows", "macos", "linux"]
      structure:
        - "src/"
        - "src-tauri/"
        - "package.json"
        - "tauri.conf.json"
        
    mobile:
      framework: "react-native"
      description: "iOS and Android mobile application"
      package_name: "@apps/mobile"
      dependencies: ["react-native", "expo", "@packages/ui", "@packages/utils"]
      status: "future_release"
      structure:
        - "src/"
        - "app.json"
        - "package.json"
        - "metro.config.js"
        
    cli:
      framework: "node.js"
      description: "Command line tools and interfaces"
      package_name: "@apps/cli"
      dependencies: ["commander", "chalk", "inquirer", "@packages/utils"]
      executable: "oneie"
      structure:
        - "src/"
        - "bin/"
        - "package.json"

  # PACKAGES DIRECTORY
  packages_directory:
    path: "packages/"
    description: "Shared packages - reusable libraries"
    
    one:
      description: "Core ONE framework"
      package_name: "@packages/one"
      exports: ["core", "cascade", "trinity", "agents"]
      dependencies: ["@packages/types", "@packages/utils"]
      structure:
        - "src/"
        - "dist/"
        - "package.json"
        - "tsconfig.json"
        
    ui:
      description: "shadcn/ui components"
      package_name: "@packages/ui"
      framework: "react"
      dependencies: ["@radix-ui/react-*", "tailwindcss", "class-variance-authority"]
      structure:
        - "components/"
        - "lib/"
        - "styles/"
        - "package.json"
        - "tsconfig.json"
        
    types:
      description: "TypeScript definitions"
      package_name: "@packages/types"
      framework: "typescript"
      exports: ["mission", "story", "task", "agent", "cascade"]
      structure:
        - "src/"
        - "dist/"
        - "package.json"
        - "tsconfig.json"
        
    config:
      description: "Shared configurations"
      package_name: "@packages/config"
      includes: ["eslint", "prettier", "tailwind", "typescript", "turbo"]
      structure:
        - "eslint/"
        - "prettier/"
        - "tailwind/"
        - "typescript/"
        - "package.json"
        
    utils:
      description: "Shared utilities"
      package_name: "@packages/utils"
      framework: "typescript"
      exports: ["file-utils", "validation", "formatting", "api-helpers"]
      structure:
        - "src/"
        - "dist/"
        - "package.json"
        - "tsconfig.json"

  # LIBRARIES DIRECTORY
  libraries_directory:
    path: "libraries/"
    description: "Business logic libraries - domain-specific functionality"
    
    content:
      description: "Content management and processing"
      package_name: "@libraries/content"
      dependencies: ["@packages/types", "@packages/utils"]
      exports: ["templates", "generators", "processors"]
      
    media:
      description: "Media handling and optimization"
      package_name: "@libraries/media"
      dependencies: ["@packages/types", "@packages/utils"]
      exports: ["image-processing", "video-processing", "audio-processing"]
      
    prompts:
      description: "AI prompt templates and management"
      package_name: "@libraries/prompts"
      dependencies: ["@packages/types"]
      exports: ["templates", "validators", "generators"]
      
    agents:
      description: "Agent coordination and management"
      package_name: "@libraries/agents"
      dependencies: ["@packages/types", "@packages/utils"]
      exports: ["orchestrator", "registry", "communication"]

  # TRINITY ARCHITECTURE INTEGRATION
  trinity_architecture:
    claude_directory:
      path: ".claude/"
      description: "Execution layer - AI agents and commands"
      immutable: false
      user_accessible: true
      
      structure:
        agents:
          path: "agents/"
          count: "112+"
          categories: ["marketing", "engineering", "content", "research", "sales", "service"]
          format: "markdown_with_yaml_frontmatter"
          
        commands:
          path: "commands/"
          purpose: "Claude Code command interface"
          examples: ["/one", "/story", "/mission", "/agent"]
          
        hooks:
          path: "hooks/"
          purpose: "Real-time automation and quality gates"
          types: ["pre-commit", "post-commit", "file-change", "quality-gate"]
          
    one_platform_directory:
      path: ".one/"
      description: "Foundation layer - Platform resources"
      immutable: true
      user_accessible: false
      
      structure:
        workflows:
          path: "workflows/"
          purpose: "Mission → Story → Task → Agent orchestration"
          
        checklists:
          path: "checklists/"
          purpose: "4-level quality validation gates"
          
        templates:
          path: "templates/"
          purpose: "Interactive excellence patterns"
          format: "yaml_with_elicitation"
          
        tasks:
          path: "tasks/"
          purpose: "Implementation task definitions"
          
        data:
          path: "data/"
          purpose: "Knowledge base and methodologies"
          
        tools:
          path: "tools/"
          purpose: "Platform utilities and generators"
          
    one_user_directory:
      path: "one/"
      description: "Creation layer - User workspace"
      immutable: false
      user_accessible: true
      customizable: true
      
      structure:
        missions:
          path: "missions/"
          purpose: "User's strategic visions"
          
        stories:
          path: "stories/"
          purpose: "User's implementation narratives"
          
        playbooks:
          path: "playbooks/"
          purpose: "User's generated content"
          
        guides:
          path: "guides/"
          purpose: "User documentation"
          
        tests:
          path: "tests/"
          purpose: "User testing"
          
        engineering:
          path: "engineering/"
          purpose: "Technical artifacts"

# TURBO CONFIGURATION TEMPLATES
turbo_configuration:
  pipeline:
    build:
      dependsOn: ["^build"]
      outputs: ["dist/**", "build/**", ".next/**", "target/**"]
      env: ["NODE_ENV"]
      
    dev:
      cache: false
      persistent: true
      
    test:
      outputs: ["coverage/**"]
      dependsOn: ["build"]
      
    lint:
      outputs: []
      
    type-check:
      dependsOn: ["^build"]
      outputs: []
      
    deploy:
      dependsOn: ["build", "test", "lint"]
      outputs: []
      
  global_dependencies: [".env", ".env.local", "turbo.json"]
  global_env: ["CI", "NODE_ENV"]

# PACKAGE MANAGEMENT CONFIGURATION
package_management:
  manager: "bun"
  workspaces:
    - "apps/*"
    - "packages/*"
    - "libraries/*"
    
  shared_dependencies:
    devDependencies:
      - "@types/node"
      - "typescript"
      - "turbo"
      - "eslint"
      - "prettier"
      - "vitest"
      
  scripts:
    development:
      dev: "turbo run dev --parallel"
      build: "turbo run build"
      test: "turbo run test"
      lint: "turbo run lint"
      type-check: "turbo run type-check"
      
    quality:
      validate: "turbo run lint test type-check"
      format: "prettier --write \"**/*.{js,ts,tsx,md,json}\""
      
    deployment:
      deploy: "turbo run deploy"
      deploy:web: "turbo run build --filter=@apps/web && vercel deploy"
      deploy:api: "turbo run deploy --filter=@apps/api"
      deploy:desktop: "turbo run build --filter=@apps/desktop"

# DEVELOPMENT EXPERIENCE
developer_experience:
  instant_setup:
    command: "npx oneie [project-name]"
    duration: "<30 seconds"
    includes: 
      - "Complete repository structure"
      - "All dependencies installed"
      - "112+ AI agents ready"
      - "Development server runnable"
      
  hot_reload:
    enabled: true
    scope: ["apps", "packages", "libraries"]
    exclude: [".one", "node_modules"]
    
  intellisense:
    typescript: "full support across monorepo"
    path_mapping: "automatic workspace resolution"
    auto_imports: "cross-package imports"

# DEPLOYMENT CONFIGURATION
deployment_targets:
  vercel:
    app: "@apps/web"
    config: "vercel.json"
    environment: ["development", "preview", "production"]
    auto_deploy: true
    
  cloudflare_pages:
    app: "@apps/web"
    config: "wrangler.toml"
    environment: ["development", "production"]
    
  convex:
    app: "@apps/api"
    config: "convex.config.ts"
    deployment: "automatic"
    
  app_stores:
    desktop: "@apps/desktop"
    mobile: "@apps/mobile"
    platforms: ["windows", "macos", "linux", "ios", "android"]
    
  npm_registry:
    packages: ["@packages/one", "@packages/ui", "@apps/cli"]
    registry: "npmjs.org"
    publish: "automated"

# QUALITY GATES AND VALIDATION
quality_assurance:
  pre_generation:
    - "Template version compatibility check"
    - "System requirements validation"
    - "Network connectivity test"
    - "Dependency availability check"
    
  generation_process:
    - "Repository structure creation"
    - "Package.json generation and validation"
    - "Dependency installation"
    - "Trinity architecture setup"
    - "Agent accessibility verification"
    
  post_generation:
    - "Build system verification"
    - "Test suite execution"
    - "Linting validation"
    - "Type checking"
    - "Development server startup test"
    
  continuous_validation:
    - "Quality gate monitoring (4.0+ stars)"
    - "Performance benchmark tracking"
    - "Security vulnerability scanning"
    - "Cross-platform compatibility testing"

