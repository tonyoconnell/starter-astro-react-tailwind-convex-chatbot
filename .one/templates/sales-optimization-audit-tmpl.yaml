# Advanced template features and validation
variables:
  conversion_metrics:
    type: object
    properties:
      overall_conversion_rate:
        type: number
        min: 0
        max: 100
        validation:
          - realistic_range: "Conversion rate should be within realistic industry ranges"
      mobile_conversion_rate:
        type: number
        min: 0
        max: 100
      desktop_conversion_rate:
        type: number
        min: 0
        max: 100
      revenue_per_visitor:
        type: number
        min: 0
      average_order_value:
        type: number
        min: 0
    validation:
      - mobile_desktop_comparison: "Mobile and desktop rates should be compared for gaps"
      - baseline_establishment: "Current metrics must establish clear baseline"
      - measurement_consistency: "All metrics must use consistent time periods"

  optimization_opportunities:
    type: array
    min_items: 3
    max_items: 10
    items:
      type: object
      properties:
        opportunity_name:
          type: string
          min_length: 10
        implementation_effort:
          type: string
          enum: ["low", "medium", "high"]
        expected_impact:
          type: string
          enum: ["low", "medium", "high", "very_high"]
        revenue_impact:
          type: string
          min_length: 10
        timeline:
          type: string
          min_length: 5
    validation:
      - impact_justification: "Each opportunity must have clear impact justification"
      - implementation_realism: "Implementation effort must be realistic"
      - prioritization_logic: "Opportunities must be prioritized by impact/effort ratio"

  testing_priorities:
    type: array
    min_items: 5
    max_items: 15
    items:
      type: object
      properties:
        test_name:
          type: string
          min_length: 10
        hypothesis:
          type: string
          min_length: 20
        expected_impact:
          type: number
          min: 1
          max: 100
        implementation_effort:
          type: string
          enum: ["low", "medium", "high"]
        test_duration:
          type: number
          min: 1
          max: 12
      required: ["test_name", "hypothesis", "expected_impact", "implementation_effort"]
    validation:
      - hypothesis_quality: "Hypotheses must be specific and testable"
      - impact_measurement: "Expected impact must be measurable"
      - test_feasibility: "Tests must be technically feasible"

quality_checks:
  conversion_analysis:
    - comprehensive_audit: "Must audit all major conversion elements"
    - mobile_optimization: "Must address mobile commerce specifically"
    - trust_building: "Must evaluate and improve trust indicators"
    - pricing_psychology: "Must analyze pricing presentation and psychology"
    - checkout_optimization: "Must identify and address checkout friction"

  technical_assessment:
    - performance_evaluation: "Must assess technical performance impact"
    - mobile_compatibility: "Must ensure mobile-first optimization approach"
    - security_compliance: "Must verify security and compliance requirements"
    - analytics_tracking: "Must establish proper tracking and measurement"

  business_impact:
    - roi_calculation: "Must provide realistic ROI projections"
    - revenue_projection: "Must project revenue impact with scenarios"
    - implementation_timeline: "Must provide achievable implementation timeline"
    - resource_planning: "Must define resource requirements clearly"

  testing_framework:
    - testing_prioritization: "Must prioritize tests by impact and effort"
    - hypothesis_formation: "Must create specific, testable hypotheses"
    - measurement_framework: "Must define clear success metrics"
    - continuous_optimization: "Must establish ongoing optimization process"

conditional_logic:
  business_type:
    product:
      focus_areas: ["product_presentation", "feature_benefits", "image_optimization"]
      optimization_priorities: ["product_gallery", "feature_comparison", "specification_display"]
    service:
      focus_areas: ["authority_building", "case_studies", "consultation_booking"]
      optimization_priorities: ["testimonials", "credentials", "process_explanation"]
    
  traffic_volume:
    low:
      testing_approach: ["qualitative_research", "user_feedback", "heatmap_analysis"]
      optimization_focus: ["major_changes", "layout_overhauls", "messaging_improvements"]
    medium:
      testing_approach: ["structured_ab_tests", "multivariate_testing", "funnel_analysis"]
      optimization_focus: ["systematic_testing", "element_optimization", "flow_improvement"]
    high:
      testing_approach: ["rapid_testing", "micro_optimizations", "personalization"]
      optimization_focus: ["continuous_testing", "granular_optimization", "ai_driven_testing"]

  industry_type:
    ecommerce:
      key_metrics: ["cart_abandonment", "product_page_conversion", "checkout_completion"]
      optimization_focus: ["product_discovery", "cart_optimization", "payment_flow"]
    saas:
      key_metrics: ["trial_conversion", "signup_completion", "upgrade_rates"]
      optimization_focus: ["trial_experience", "onboarding_flow", "upgrade_messaging"]
    services:
      key_metrics: ["consultation_bookings", "quote_requests", "contact_conversions"]
      optimization_focus: ["credibility_building", "consultation_process", "trust_signals"]

input_validation:
  required_fields:
    - company_name
    - current_conversion_rate
    - current_monthly_revenue
    - primary_traffic_sources
    - target_audience
    - business_type
    - optimization_budget
    - implementation_timeline

  performance_data:
    - conversion_rates: "Must provide current conversion rate data"
    - traffic_volume: "Must specify monthly traffic volume"
    - revenue_data: "Must provide revenue and AOV data"
    - mobile_analytics: "Must include mobile-specific performance data"

  technical_requirements:
    - current_platform: "Must specify current e-commerce/website platform"
    - analytics_setup: "Must describe current analytics implementation"
    - testing_capabilities: "Must specify A/B testing platform availability"
    - development_resources: "Must clarify available development resources"

validation_rules:
  data_quality:
    - metrics_accuracy: "All metrics must be verified and accurate"
    - baseline_establishment: "Clear baseline must be established for all KPIs"
    - measurement_consistency: "All measurements must use consistent time periods"
    - benchmark_comparison: "Performance must be compared to industry benchmarks"

  optimization_quality:
    - impact_prioritization: "Optimizations must be prioritized by potential impact"
    - implementation_feasibility: "All recommendations must be implementable"
    - resource_alignment: "Recommendations must align with available resources"
    - timeline_realism: "Implementation timelines must be realistic and achievable"

  testing_quality:
    - hypothesis_specificity: "Test hypotheses must be specific and measurable"
    - sample_size_adequacy: "Tests must have adequate sample sizes for significance"
    - success_criteria_clarity: "Success criteria must be clearly defined"
    - testing_methodology: "Testing approach must follow statistical best practices"

business_impact_assessment:
  revenue_optimization:
    - conversion_improvement: "Primary focus on conversion rate optimization"
    - aov_enhancement: "Strategies for increasing average order value"
    - customer_lifetime_value: "Long-term customer value optimization"
    - revenue_per_visitor: "Overall revenue efficiency improvement"

  competitive_advantage:
    - user_experience: "Superior user experience compared to competitors"
    - conversion_efficiency: "Higher conversion rates than industry average"
    - mobile_optimization: "Best-in-class mobile commerce experience"
    - trust_credibility: "Stronger trust signals and credibility indicators"

  scalability_factors:
    - testing_infrastructure: "Scalable A/B testing and optimization framework"
    - performance_monitoring: "Comprehensive performance monitoring system"
    - continuous_improvement: "Ongoing optimization and improvement processes"
    - team_capability: "Team capabilities for sustained optimization efforts"