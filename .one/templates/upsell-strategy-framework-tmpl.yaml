# Advanced template configuration and validation
variables:
  upsell_offers:
    type: array
    description: "Primary upsell offerings and their strategic positioning"
    min_items: 3
    max_items: 10
    items:
      type: object
      properties:
        offer_name:
          type: string
          min_length: 5
        offer_type:
          type: string
          enum: ["tier_upgrade", "feature_addition", "service_expansion", "volume_increase", "premium_support"]
        revenue_impact:
          type: number
          min: 0
        customer_value:
          type: string
          min_length: 20
        target_segments:
          type: array
          items:
            type: string
    validation:
      - offer_value_clarity: "Each offer must have clear customer value proposition"
      - revenue_projection: "Revenue impact must be realistic and data-driven"
      - segment_alignment: "Offers must align with target segment needs"

  timing_triggers:
    type: array
    description: "Behavioral and contextual triggers that indicate upsell readiness"
    min_items: 5
    max_items: 15
    items:
      type: object
      properties:
        trigger_name:
          type: string
          min_length: 5
        trigger_type:
          type: string
          enum: ["behavioral", "usage_based", "milestone", "seasonal", "lifecycle"]
        readiness_score:
          type: number
          min: 1
          max: 10
        response_strategy:
          type: string
          min_length: 20
    validation:
      - trigger_specificity: "Triggers must be specific and measurable"
      - scoring_logic: "Scoring system must be logical and consistent"
      - response_appropriateness: "Response strategies must match trigger urgency"

  value_stacking:
    type: object
    description: "Value stacking framework for compelling upsell presentations"
    properties:
      core_value:
        type: object
        required: ["primary_benefit", "quantified_impact", "success_metrics"]
      supplementary_layers:
        type: array
        min_items: 3
        items:
          type: object
          required: ["layer_name", "benefits", "value_quantification"]
      communication_strategy:
        type: object
        required: ["presentation_sequence", "benefit_emphasis", "objection_prevention"]
    validation:
      - value_hierarchy: "Value layers must build logically upon each other"
      - quantification_accuracy: "Value quantification must be credible and verifiable"
      - communication_clarity: "Value communication must be clear and compelling"

