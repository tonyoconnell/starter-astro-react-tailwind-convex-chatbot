          - Value Proposition: {{feature_expansion_value_prop}}
          - Complementary Value Logic: {{feature_expansion_complementary_logic}}
          - Next-Step Goal Alignment: How does this solve the next logical need after using the initial product?
          - Perceived Likelihood Boost: {{feature_expansion_pl_boost}}
          - Average Revenue Impact: {{feature_expansion_revenue_impact}}
