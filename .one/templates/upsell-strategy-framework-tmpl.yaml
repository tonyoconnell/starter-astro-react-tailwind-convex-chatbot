sections:
  - id: strategy-overview
    title: Upsell Strategy Framework Overview
    instruction: |
      This upsell strategy framework creates comprehensive revenue expansion systems focused on customer value maximization and relationship preservation.
      
      The framework includes:
      - Revenue optimization strategies with customer-centric approaches
      - Conditional frameworks for product-based vs service-based upselling
      - Timing and trigger optimization for maximum acceptance rates
      - Value communication and packaging strategies
      - Customer success-driven upselling methodologies
      - Performance tracking for revenue and relationship optimization
      
      Output file location: `docs/{{company_name}}-upsell-strategy-framework.md`

  - id: revenue-optimization-framework
    title: Revenue Optimization & Customer Value Maximization
    instruction: |
      Design comprehensive revenue optimization strategies with LLM assistance for maximum expansion potential.
      Focus on sustainable revenue growth through enhanced customer value delivery.
    variables:
      - upsell_offers
      - revenue_targets
      - customer_segments
    sections:
      - id: revenue-strategy-architecture
        title: Revenue Expansion Strategy Architecture
        template: |
          **Revenue Optimization Philosophy:**
          {{revenue_optimization_philosophy}}
          
          **Elevate Framework Integration:**
          This framework implements Step 7: UPSELL from the Elevate Ecommerce Framework, focusing on maximizing Average Order Value (AOV) and immediate profitability by presenting relevant, compelling upsell offers at the point of maximum buyer enthusiasm and commitment - typically on the post-purchase thank you page or within initial confirmation emails.
          
          **Core Elevate Principles:**
          - **Peak Commitment Psychology**: Leverage the height of buyer commitment immediately post-purchase when customers are psychologically inclined to consistency and experiencing peak enthusiasm
          - **Relevance First**: Upsells must be highly relevant to the initial purchase, logically complementing, enhancing, or accelerating the results customers seek
          - **Value Equation Application**: Apply mini-Hormozi principles to articulate how upsells enhance Dream Outcome, increase Perceived Likelihood, save Time, or reduce Effort/Sacrifice
          - **Friction Elimination**: Make upsell acceptance extremely simple - ideally single-click without re-entering payment details
          - **Ethical Enhancement**: Focus on genuine value addition that enhances customer satisfaction rather than extracting maximum revenue
          
          **Customer Value Maximization Framework:**
          {{customer_value_maximization_approach}}
          
          **Revenue Expansion Categories:**
          
          **Tier Advancement Upsells:**
          - Strategy Focus: {{tier_advancement_strategy}}
          - Value Proposition: {{tier_advancement_value_prop}}
          - Elevate Relevance Check: How does this enhance their original Dream Outcome?
          - Hormozi Value Enhancement: {{tier_advancement_value_enhancement}}
          - Average Revenue Impact: {{tier_advancement_revenue_impact}}
          - Customer Success Correlation: {{tier_advancement_success_correlation}}
          - Implementation Timeline: {{tier_advancement_timeline}}
          - Post-Purchase Timing: {{tier_advancement_timing_strategy}}
          
          **Feature/Module Expansion:**
