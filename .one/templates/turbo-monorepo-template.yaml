# Turbo Monorepo Template for NPX OneIE Universal Access
# Generated by Builder Agent - Universal Repository Creation System

template:
  id: turbo-monorepo-npx-oneie
  name: "ONE Framework Turbo Monorepo"
  description: "Complete production-ready Turbo monorepo with Trinity architecture and 112+ AI agents"
  version: "1.0.0"
  builder_agent: true
  
  workflow:
    mode: automated
    generation_time: "<30 seconds"
    quality_gate: "4.0+ stars"
    
  architecture:
    type: "trinity"
    layers:
      - ".claude/"    # Execution layer (112+ agents)
      - ".one/"       # Foundation layer (platform resources)
      - "one/"        # Creation layer (user workspace)
      
  technology_stack:
    monorepo: "turbo + bun"
    frontend: "next.js 15 + react 19 + typescript"
    backend: "convex (real-time collaboration)"
    ui: "shadcn/ui + tailwind css + radix ui"
    desktop: "tauri (rust + webview)"
    mobile: "react native + expo"
    cli: "node.js + commander.js + chalk"
    testing: "vitest + react testing library + playwright"
    
structure:
  root:
    files:
      - name: "package.json"
        template: "root-package-json"
        required: true
        
      - name: "turbo.json"
        template: "turbo-config"
        required: true
        
      - name: "bun.lockb"
        generated: true
        
      - name: ".gitignore"
        template: "turbo-gitignore"
        required: true
        
      - name: "README.md"
        template: "oneie-readme"
        required: true
        
  directories:
    apps:
      description: "Application packages"
      packages:
        web:
          framework: "next.js 15"
          description: "Web application with React 19"
          dependencies: ["@repo/ui", "@repo/types", "@repo/utils"]
          deployment: ["vercel", "cloudflare-pages"]
          
        api:
          framework: "convex"
          description: "Backend services with real-time collaboration"
          dependencies: ["convex", "@repo/types"]
          
        desktop:
          framework: "tauri"
          description: "Cross-platform desktop application"
          dependencies: ["@repo/ui", "@repo/utils"]
          platforms: ["windows", "macos", "linux"]
          
        mobile:
          framework: "react-native"
          description: "iOS and Android mobile application"
          dependencies: ["@repo/ui", "@repo/utils"]
          status: "future"
          
        cli:
          framework: "node.js"
          description: "Command line tools and interfaces"
          dependencies: ["commander", "chalk", "@repo/utils"]
          
    packages:
      description: "Shared packages"
      packages:
        one:
          description: "Core ONE framework"
          exports: ["core", "cascade", "trinity"]
          
        ui:
          description: "shadcn/ui components"
          framework: "react"
          dependencies: ["@radix-ui/react-*", "tailwindcss"]
          
        types:
          description: "TypeScript definitions"
          framework: "typescript"
          
        config:
          description: "Shared configurations"
          includes: ["eslint", "prettier", "tailwind", "typescript"]
          
        utils:
          description: "Shared utilities"
          framework: "typescript"
          
    libraries:
      description: "Business logic libraries"
      packages:
        content:
          description: "Content management"
          dependencies: ["@repo/types"]
          
        media:
          description: "Media handling"
          dependencies: ["@repo/types", "@repo/utils"]
          
        prompts:
          description: "AI prompt templates"
          dependencies: ["@repo/types"]
          
        agents:
          description: "Agent coordination"
          dependencies: ["@repo/types", "@repo/utils"]
          
    trinity_architecture:
      ".claude":
        description: "Execution layer - AI agents and commands"
        structure:
          agents: "112+ specialized AI agents"
          commands: "Claude Code command interface"
          hooks: "Real-time automation hooks"
          
      ".one":
        description: "Foundation layer - Platform resources"
        structure:
          workflows: "Mission → Story → Task → Agent orchestration"
          checklists: "4-level quality validation gates"
          templates: "Interactive excellence patterns"
          tasks: "Implementation task definitions"
          data: "Knowledge base and methodologies"
          tools: "Platform utilities and generators"
          
      "one":
        description: "Creation layer - User workspace"
        structure:
          missions: "User's strategic visions"
          stories: "User's implementation narratives"
          playbooks: "User's generated content"
          guides: "User documentation"
          tests: "User testing"
          engineering: "Technical artifacts"
          
configuration:
  turbo:
    pipeline:
      build:
        dependsOn: ["^build"]
        outputs: ["dist/**", "build/**", ".next/**"]
        
      dev:
        cache: false
        
      lint:
        outputs: []
        
      test:
        outputs: ["coverage/**"]
        
  package_manager: "bun"
  node_version: "18+"
  
scripts:
  development:
    dev: "turbo run dev --parallel"
    build: "turbo run build"
    test: "turbo run test"
    lint: "turbo run lint"
    
  deployment:
    deploy:web: "turbo run build --filter=web && vercel deploy"
    deploy:all: "turbo run build && ./scripts/deploy-all.sh"
    
quality_gates:
  generation:
    - "All packages compile successfully"
    - "Turbo pipeline executes without errors"
    - "Trinity architecture properly structured"
    - "112+ agents accessible"
    
  validation:
    - "4.0+ stars on generated code quality"
    - "All dependencies resolve correctly"
    - "Development server starts successfully"
    - "Build process completes successfully"
    
deployment:
  targets:
    vercel:
      app: "web"
      config: "vercel.json"
      environment: ["development", "preview", "production"]
      
    cloudflare_pages:
      app: "web"
      config: "wrangler.toml"
      
    npm:
      package: "cli"
      registry: "npmjs.org"
      
features:
  instant_setup:
    command: "npx oneie"
    duration: "<30 seconds"
    includes: ["complete repository", "112+ agents", "development environment"]
    
  ai_ready:
    agents: 112
    cascade_system: "Mission → Story → Task → Agent"
    quality_gates: "4-level validation"
    
  modern_stack:
    frontend: "Next.js 15 + React 19"
    backend: "Convex real-time"
    ui: "shadcn/ui + Tailwind"
    deployment: "Multi-platform"
    
  cross_platform:
    web: ["Vercel", "Cloudflare", "Netlify"]
    desktop: ["Windows", "macOS", "Linux"]
    mobile: ["iOS", "Android"]
    
documentation:
  readme: "Complete setup and usage guide"
  contributing: "Contribution guidelines and development setup"
  architecture: "Trinity system and cascade workflow documentation"
  deployment: "Multi-platform deployment instructions"
  
validation:
  pre_generation:
    - "Template version compatibility"
    - "System requirements check"
    - "Network connectivity validation"
    
  post_generation:
    - "Repository structure validation"
    - "Dependency resolution check"
    - "Build system verification"
    - "Agent accessibility test"
    
  continuous:
    - "Quality gate monitoring"
    - "Performance benchmarks"
    - "Security vulnerability scanning"
    - "Cross-platform compatibility"