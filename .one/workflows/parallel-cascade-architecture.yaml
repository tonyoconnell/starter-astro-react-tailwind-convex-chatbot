  concurrent_task_quality_gate:
    processing_time: under_3_minutes
    parallel_processing: up_to_50_tasks_simultaneously
    criteria:
      - original_task_criteria_plus
      - deadlock_prevention_verification_4_5_stars
      - dependency_dag_validation_4_0_stars
      - parallel_execution_safety_4_0_stars
  
  dynamic_agent_quality_gate:
    processing_time: under_2_minutes
    parallel_processing: real_time_continuous
    criteria:
      - original_agent_criteria_plus
