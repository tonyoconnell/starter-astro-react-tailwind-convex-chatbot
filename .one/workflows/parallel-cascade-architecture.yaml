  deployment_quality_gate:
    processing_time: under_10_minutes
    parallel_processing: up_to_5_deployments_simultaneously
    criteria:
      - deployment_readiness_4_5_stars
      - rollback_capability_verified_4_5_stars
      - performance_benchmarks_met_4_0_stars
