# .one Directory Structure - Platform Orchestration Engine
# This file defines the immutable hidden orchestration architecture

platform:
  version: "1.3.0"
  type: "hidden-orchestration-engine"
  stability: "production-ready"
  
architecture:
  pattern: "cascade-workflow-implementation"
  quality_gates: "4-level-validation"
  integration: "claude-code-native"
  
directories:
  # Core orchestration
  # Note: agents moved to .claude/agents/ (112+ total) while maintaining .one/ resource access
    
  workflows:
    purpose: "Mission → Story → Task → Agent orchestration patterns"
    stability: "versioned"
    quality_gate: "production-validated"
    
  templates:
    purpose: "Interactive document generation with elicitation"
    stability: "extensible"
    quality_gate: "user-validated"
    
  teams:
    purpose: "Agent bundle configurations for domain expertise"
    stability: "configurable"
    quality_gate: "performance-validated"
    
  # Quality assurance
  checklists:
    purpose: "Automated quality validation for cascade levels"
    stability: "immutable"
    quality_gate: "100% pass rate required"
    
  # Platform infrastructure
  tools:
    purpose: "CLI, installers, generators, and build systems"
    stability: "versioned"
    quality_gate: "integration-tested"
    
  hooks:
    purpose: "Real-time quality monitoring and validation"
    stability: "immutable"
    quality_gate: "performance-critical"
    
  # Knowledge base
  data:
    purpose: "Platform knowledge, methodologies, and frameworks"
    stability: "versioned"
    quality_gate: "accuracy-validated"
    
  # Legacy support
  missions:
    purpose: "Legacy mission definitions (deprecated in favor of user space)"
    stability: "readonly"
    migration_target: "user/one/missions/"
    
  stories:
    purpose: "Legacy story definitions (deprecated in favor of user space)" 
    stability: "readonly"
    migration_target: "user/one/stories/"
    
  tasks:
    purpose: "Legacy task definitions (deprecated in favor of user space)"
    stability: "readonly"
    migration_target: "user/one/tasks/"
    
  playbooks:
    purpose: "Legacy playbook outputs (deprecated in favor of user space)"
    stability: "readonly"
    migration_target: "user/one/playbooks/"

configuration:
  # Main platform interface
  interface.md:
    purpose: "Primary platform UI and menu system"
    stability: "versioned"
    quality_gate: "ux-validated"
    
  # Installation and setup
  tools/installer/:
    purpose: "Multi-IDE installation and configuration system"
    stability: "production-ready"
    quality_gate: "compatibility-tested"
    
  # Content generation
  tools/playbook-generator/:
    purpose: "Production-ready playbook generation system"
    stability: "production-ready"
    quality_gate: "output-validated"

integration:
  claude_code:
    hooks: "real-time quality validation"
    commands: "cascade workflow interface"
    mcp_tools: "GitHub, Convex, ShadCN integration"
    
  user_space:
    source: "one/"
    target: "user workspace for missions, stories, tasks"
    relationship: "orchestration-engine-to-user-content"
    
quality_metrics:
  mission_11_validation:
    quality_gate_pass_rate: "100%"
    average_quality_score: "4.43/5.0"
    system_reliability: "99.7%"
    roi_demonstration: "79,450%"
    
cascade_workflow:
  levels:
    - mission: "Strategic planning and story spawning"
    - story: "Engineering narratives with agile integration" 
    - task: "Precision execution and agent coordination"
    - agent: "Domain expert implementation"
    
  validation:
    each_level: "4.0+ stars required before advancement"
    automated: "real-time quality gates"
    manual: "checklist validation"
    
migration_strategy:
  phase_1: "Stabilize .one/ as immutable orchestration engine"
  phase_2: "Migrate user content from .one/ to one/"
  phase_3: "Establish clear separation of concerns"
  phase_4: "Production deployment with user space focus"

security:
  path_validation: "enterprise-grade security hardening"
  agent_sandboxing: "isolated execution environments"
  quality_enforcement: "mandatory validation gates"