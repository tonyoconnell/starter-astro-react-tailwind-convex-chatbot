# Validation Rules for Task Registry
validation_rules:
  task_id_format: "^task-\\d+\\.\\d+\\.\\d+$"
  file_naming_pattern: "^task-\\d+\\.\\d+\\.\\d+-[a-z0-9-]+\\.md$"
  
  required_fields:
    - id
    - full_id  
    - title
    - status
    - agent
    - prerequisites
    - enables
    - file
    
  valid_statuses:
    - "Planned"
    - "Ready" 
    - "In Progress"
    - "Complete"
    - "Blocked"
    - "Cancelled"
    
  quality_score_range: [1.0, 5.0]

